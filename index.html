<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>SVTVN BANK</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#0b0d11;
    --card:#141820;
    --card2:#1a1f28;
    --text:#f5f7fa;
    --muted:#8d95a3;
    --accent:#087cff;
    --accent2:#55aaff;
    --green:#21d789;
    --red:#ff4d5a;
    --yellow:#ffd35a;
    --border:rgba(255,255,255,.08);
    --shadow:0 20px 60px rgba(0,0,0,.35);
}

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
    "Segoe UI",sans-serif;
    background:
        radial-gradient(circle at 50% -10%,rgba(0,122,255,.18),transparent 40%),
        var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
    transition:.45s;
}

button,input{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
    color:inherit;
}

.app{
    width:100%;
    max-width:520px;
    margin:auto;
    min-height:100vh;
    padding-bottom:100px;
}

/* ================= TOP ================= */

.top{
    height:75px;
    padding:18px 18px 10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:50;
    backdrop-filter:blur(20px);
    background:rgba(10,12,16,.72);
}

.logo{
    font-size:20px;
    font-weight:800;
    background:var(--accent);
    padding:8px 18px;
    border-radius:22px;
    box-shadow:0 0 30px color-mix(in srgb,var(--accent) 35%,transparent);
    animation:logoFloat 4s ease-in-out infinite;
}

@keyframes logoFloat{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-2px)}
}

.topBalance{
    font-weight:700;
    font-size:15px;
}

/* ================= PAGES ================= */

.page{
    display:none;
    padding:15px 18px;
    animation:pageIn .35s ease;
}

.page.active{
    display:block;
}

@keyframes pageIn{
    from{
        opacity:0;
        transform:translateY(15px);
    }
    to{
        opacity:1;
        transform:none;
    }
}

/* ================= HOME ================= */

.greeting{
    margin-top:12px;
    font-size:29px;
    font-weight:800;
}

.sub{
    color:var(--muted);
    margin-top:5px;
}

.balanceCard{
    margin-top:25px;
    padding:25px;
    min-height:205px;
    border-radius:30px;
    position:relative;
    overflow:hidden;
    background:
        linear-gradient(135deg,
        color-mix(in srgb,var(--accent) 95%,black),
        color-mix(in srgb,var(--accent) 35%,#111));
    box-shadow:
        0 20px 60px color-mix(in srgb,var(--accent) 20%,transparent);
    animation:cardIdle 5s ease-in-out infinite;
}

@keyframes cardIdle{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-4px)}
}

.balanceCard:before{
    content:"";
    position:absolute;
    width:250px;
    height:250px;
    border-radius:50%;
    background:rgba(255,255,255,.1);
    right:-100px;
    top:-130px;
}

.balanceLabel{
    color:rgba(255,255,255,.7);
}

.balance{
    font-size:43px;
    font-weight:850;
    margin-top:15px;
    letter-spacing:-2px;
}

.cardName{
    position:absolute;
    bottom:22px;
    left:25px;
    font-size:14px;
    opacity:.85;
}

.cardNumber{
    position:absolute;
    bottom:22px;
    right:25px;
    font-size:13px;
    opacity:.7;
}

.actions{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-top:18px;
}

.action{
    padding:15px 5px;
    border-radius:20px;
    background:var(--card);
    border:1px solid var(--border);
    text-align:center;
    transition:.2s;
}

.action:active{
    transform:scale(.92);
}

.actionIcon{
    font-size:24px;
    margin-bottom:6px;
}

.actionText{
    font-size:11px;
    color:var(--muted);
}

/* ================= SECTIONS ================= */

.sectionTitle{
    font-size:21px;
    font-weight:800;
    margin:27px 0 12px;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:25px;
    padding:18px;
    box-shadow:var(--shadow);
}

.transaction{
    display:flex;
    align-items:center;
    gap:13px;
    padding:13px 0;
    border-bottom:1px solid var(--border);
}

.transaction:last-child{
    border-bottom:0;
}

.txIcon{
    width:44px;
    height:44px;
    border-radius:15px;
    display:grid;
    place-items:center;
    background:var(--card2);
}

.txInfo{
    flex:1;
}

.txTitle{
    font-weight:700;
}

.txDate{
    color:var(--muted);
    font-size:12px;
    margin-top:3px;
}

.plus{
    color:var(--green);
}

.minus{
    color:var(--red);
}

/* ================= BOTTOM ================= */

.nav{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:min(520px,100%);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    display:grid;
    grid-template-columns:repeat(5,1fr);
    background:rgba(12,14,18,.88);
    backdrop-filter:blur(25px);
    border-top:1px solid var(--border);
    z-index:100;
}

.navBtn{
    background:none;
    color:var(--muted);
    padding:7px 0;
    transition:.25s;
}

.navBtn.active{
    color:var(--accent2);
    transform:translateY(-3px);
}

.navIcon{
    font-size:21px;
}

.navText{
    font-size:10px;
    margin-top:3px;
}

/* ================= PROFILE ================= */

.profileHead{
    text-align:center;
    padding:20px 0;
}

.avatar{
    width:90px;
    height:90px;
    margin:auto;
    border-radius:50%;
    display:grid;
    place-items:center;
    font-size:34px;
    font-weight:800;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 0 40px color-mix(in srgb,var(--accent) 30%,transparent);
}

.profileName{
    font-size:25px;
    font-weight:800;
    margin-top:13px;
}

.username{
    color:var(--muted);
}

.menuItem{
    width:100%;
    background:var(--card);
    padding:17px;
    border-radius:19px;
    margin-top:9px;
    display:flex;
    align-items:center;
    gap:13px;
    text-align:left;
    border:1px solid var(--border);
    transition:.2s;
}

.menuItem:active{
    transform:scale(.97);
}

.menuItem span:last-child{
    margin-left:auto;
    color:var(--muted);
}

.danger{
    color:#ff5663;
}

/* ================= MODAL ================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    backdrop-filter:blur(15px);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:200;
}

.modal.show{
    display:flex;
}

.sheet{
    width:min(520px,100%);
    background:var(--card);
    border-radius:30px 30px 0 0;
    padding:25px;
    animation:sheetIn .3s ease;
    padding-bottom:calc(25px + env(safe-area-inset-bottom));
}

@keyframes sheetIn{
    from{transform:translateY(100%)}
    to{transform:none}
}

.input{
    width:100%;
    padding:16px;
    margin-top:10px;
    background:var(--card2);
    border:1px solid var(--border);
    border-radius:17px;
    color:var(--text);
    outline:none;
}

.btn{
    width:100%;
    padding:17px;
    margin-top:12px;
    border-radius:18px;
    background:var(--accent);
    font-weight:800;
    transition:.2s;
}

.btn:active{
    transform:scale(.96);
}

.btn.secondary{
    background:var(--card2);
}

.btn.dangerBtn{
    background:var(--red);
}

/* ================= AUTH ================= */

.auth{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;
}

.authBox{
    width:100%;
    max-width:420px;
    animation:pageIn .6s ease;
}

.authLogo{
    text-align:center;
    font-size:30px;
    font-weight:900;
    margin-bottom:30px;
}

.authBox h1{
    font-size:32px;
}

.authBox p{
    color:var(--muted);
}

.authSwitch{
    text-align:center;
    color:var(--accent2);
    margin-top:20px;
}

/* ================= PIN ================= */

.pinScreen{
    min-height:100vh;
    background:#1b1f24;
    color:#f5f5f7;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:20vh;
}

.pinLogo{
    background:#087cff;
    padding:7px 20px;
    border-radius:24px;
    font-size:25px;
    font-weight:800;
}

.pinName{
    margin-top:90px;
    font-size:34px;
    font-weight:800;
}

.dots{
    display:flex;
    gap:28px;
    margin-top:55px;
}

.dot{
    width:13px;
    height:13px;
    border-radius:50%;
    background:#85878a;
    transition:.15s;
}

.dot.filled{
    background:white;
    transform:scale(1.15);
}

.pinKeys{
    width:100%;
    max-width:450px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    margin-top:130px;
    row-gap:35px;
}

.pinKey{
    background:none;
    font-size:57px;
    color:#f5f5f7;
    transition:.12s;
}

.pinKey:active{
    transform:scale(.8);
    opacity:.5;
}

.pinBottom{
    position:absolute;
    bottom:55px;
    color:#aaa;
    font-size:17px;
}

.shake{
    animation:shake .35s;
}

@keyframes shake{
    20%{transform:translateX(-12px)}
    40%{transform:translateX(12px)}
    60%{transform:translateX(-8px)}
    80%{transform:translateX(8px)}
}

/* ================= CASINO ================= */

.casinoHero{
    padding:22px;
    border-radius:27px;
    background:
      radial-gradient(circle at 80% 20%,rgba(255,0,90,.25),transparent 35%),
      linear-gradient(135deg,#171922,#101116);
    overflow:hidden;
    position:relative;
}

.casinoHero h1{
    font-size:30px;
    margin:0;
}

.casinoHero p{
    color:var(--muted);
}

.games{
    display:grid;
    gap:12px;
    margin-top:17px;
}

.gameCard{
    min-height:120px;
    padding:20px;
    border-radius:24px;
    background:var(--card);
    border:1px solid var(--border);
    position:relative;
    overflow:hidden;
    transition:.25s;
}

.gameCard:active{
    transform:scale(.97);
}

.gameEmoji{
    font-size:35px;
}

.gameName{
    font-size:20px;
    font-weight:800;
    margin-top:8px;
}

.gameDesc{
    color:var(--muted);
    font-size:12px;
}

.gameGlow{
    position:absolute;
    width:130px;
    height:130px;
    right:-40px;
    top:-30px;
    border-radius:50%;
    background:var(--accent);
    filter:blur(45px);
    opacity:.3;
}

/* ================= CASINO GAME ================= */

.gameHeader{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:18px;
}

.back{
    background:var(--card);
    width:42px;
    height:42px;
    border-radius:15px;
}

.gameTitle{
    font-size:25px;
    font-weight:850;
}

.betBox{
    background:var(--card);
    padding:17px;
    border-radius:23px;
    border:1px solid var(--border);
}

.betLabel{
    color:var(--muted);
    font-size:13px;
}

.betInput{
    width:100%;
    border:0;
    background:none;
    color:white;
    outline:none;
    font-size:30px;
    font-weight:800;
    margin-top:5px;
}

.betPresets{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
    margin-top:10px;
}

.preset{
    padding:9px;
    border-radius:12px;
    background:var(--card2);
}

/* ================= MINES ================= */

.minesGrid{
    margin-top:18px;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
}

.mineCell{
    aspect-ratio:1;
    border-radius:15px;
    background:linear-gradient(145deg,#202631,#11151c);
    border:1px solid rgba(255,255,255,.06);
    display:grid;
    place-items:center;
    font-size:25px;
    transition:.18s;
    box-shadow:inset 0 2px 5px rgba(255,255,255,.03);
}

.mineCell:active{
    transform:scale(.9);
}

.mineCell.open{
    background:linear-gradient(145deg,#28303c,#171b23);
    animation:mineOpen .25s ease;
}

@keyframes mineOpen{
    from{transform:scale(.7);opacity:0}
    to{transform:none;opacity:1}
}

.mineCell.win{
    background:rgba(33,215,137,.15);
    border-color:var(--green);
}

.mineCell.boom{
    background:rgba(255,77,90,.2);
    border-color:var(--red);
    animation:boom .45s;
}

@keyframes boom{
    30%{transform:scale(1.15)}
    60%{transform:scale(.85)}
}

/* ================= UPGRADER ================= */

.wheelWrap{
    width:280px;
    height:280px;
    margin:35px auto;
    position:relative;
}

.wheel{
    width:100%;
    height:100%;
    border-radius:50%;
    background:
        conic-gradient(
            #21d789 0deg 180deg,
            #ff4d5a 180deg 360deg
        );
    box-shadow:
        0 0 40px rgba(33,215,137,.15),
        inset 0 0 25px rgba(0,0,0,.3);
    transition:transform 3.5s cubic-bezier(.12,.75,.2,1);
}

.wheel:after{
    content:"50%";
    position:absolute;
    width:100px;
    height:100px;
    border-radius:50%;
    background:#151820;
    top:90px;
    left:90px;
    display:grid;
    place-items:center;
    font-size:23px;
    font-weight:900;
}

.pointer{
    position:absolute;
    top:-20px;
    left:50%;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:13px solid transparent;
    border-right:13px solid transparent;
    border-top:30px solid white;
    z-index:5;
    filter:drop-shadow(0 3px 5px black);
}

/* ================= CRASH ================= */

.crashArena{
    margin-top:18px;
    height:310px;
    border-radius:25px;
    overflow:hidden;
    position:relative;
    background:
      radial-gradient(circle at 70% 25%,rgba(0,140,255,.2),transparent 30%),
      linear-gradient(#080b12,#111723);
    border:1px solid var(--border);
}

.stars{
    position:absolute;
    inset:0;
    background-image:
      radial-gradient(circle,white 1px,transparent 1px);
    background-size:55px 55px;
    opacity:.15;
    animation:starsMove 7s linear infinite;
}

@keyframes starsMove{
    from{background-position:0 0}
    to{background-position:55px 55px}
}

.rocket{
    position:absolute;
    font-size:55px;
    left:15%;
    bottom:15%;
    transform:rotate(-35deg);
    filter:drop-shadow(0 0 20px #299dff);
}

.crashX{
    position:absolute;
    top:40%;
    width:100%;
    text-align:center;
    font-size:52px;
    font-weight:900;
}

.crashStatus{
    text-align:center;
    margin-top:12px;
    color:var(--muted);
}

/* ================= CLICKER ================= */

.clicker{
    height:330px;
    display:grid;
    place-items:center;
    position:relative;
}

.coin{
    width:190px;
    height:190px;
    border-radius:50%;
    display:grid;
    place-items:center;
    font-size:65px;
    background:linear-gradient(145deg,#ffd85b,#e99c00);
    box-shadow:
      0 0 50px rgba(255,193,7,.25),
      inset 0 5px 10px rgba(255,255,255,.3);
    animation:coinIdle 2.5s ease-in-out infinite;
    user-select:none;
}

.coin:active{
    transform:scale(.88);
}

@keyframes coinIdle{
    0%,100%{transform:translateY(0) rotate(-2deg)}
    50%{transform:translateY(-9px) rotate(2deg)}
}

.floatMoney{
    position:absolute;
    font-size:25px;
    color:#ffd34d;
    font-weight:900;
    pointer-events:none;
    animation:moneyFloat 1s forwards;
}

@keyframes moneyFloat{
    from{
        opacity:1;
        transform:translateY(0) scale(.8);
    }
    to{
        opacity:0;
        transform:translateY(-100px) scale(1.2);
    }
}

/* ================= TOAST ================= */

.toast{
    position:fixed;
    left:50%;
    top:80px;
    transform:translateX(-50%) translateY(-20px);
    background:#242933;
    padding:13px 18px;
    border-radius:18px;
    opacity:0;
    pointer-events:none;
    z-index:500;
    transition:.3s;
    box-shadow:0 10px 35px rgba(0,0,0,.35);
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* ================= THEMES ================= */

body.theme-light{
    --bg:#f3f5f8;
    --card:#fff;
    --card2:#eef1f5;
    --text:#111318;
    --muted:#727987;
    --border:rgba(0,0,0,.07);
}

body.theme-purple{
    --accent:#9b5cff;
    --accent2:#c59aff;
}

body.theme-red{
    --accent:#ef3340;
    --accent2:#ff6b73;
}

body.theme-green{
    --accent:#19b873;
    --accent2:#54e6aa;
}

body.theme-blue{
    --accent:#087cff;
    --accent2:#55aaff;
}

body.theme-dark{
    --accent:#087cff;
    --accent2:#55aaff;
}

/* ================= RESPONSIVE ================= */

@media(max-width:380px){
    .balance{
        font-size:36px;
    }

    .coin{
        width:160px;
        height:160px;
    }

    .wheelWrap{
        width:240px;
        height:240px;
    }

    .wheel:after{
        width:85px;
        height:85px;
        top:77px;
        left:77px;
    }
}
</style>
</head>

<body>

<div id="root"></div>
<div id="toast" class="toast"></div>

<script>
/* =========================================================
   SVTVN BANK
   SINGLE FILE BANK SIMULATOR
========================================================= */

const KEY="svtvn_bank_account_v3";

let account=JSON.parse(localStorage.getItem(KEY)||"null");

let state={
    page:"home",
    casinoMode:null,
    mines:null,
    upgraderSpinning:false,
    crash:null
};

/* =========================================================
   SOUND ENGINE
========================================================= */

let audioCtx=null;

function sound(type="click"){
    try{
        if(!audioCtx)
            audioCtx=new(window.AudioContext||window.webkitAudioContext)();

        const o=audioCtx.createOscillator();
        const g=audioCtx.createGain();

        o.connect(g);
        g.connect(audioCtx.destination);

        let freq=500;

        if(type==="success") freq=760;
        if(type==="error") freq=130;
        if(type==="money") freq=900;
        if(type==="win") freq=1100;
        if(type==="boom") freq=80;

        o.frequency.value=freq;
        o.type=type==="boom"?"sawtooth":"sine";

        g.gain.setValueAtTime(.001,audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(.09,audioCtx.currentTime+.02);
        g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.18);

        o.start();
        o.stop(audioCtx.currentTime+.2);
    }catch(e){}
}

/* =========================================================
   HELPERS
========================================================= */

function save(){
    localStorage.setItem(KEY,JSON.stringify(account));
}

function money(n){
    return Number(n||0).toLocaleString("ru-RU",{
        minimumFractionDigits:2,
        maximumFractionDigits:2
    })+" ₽";
}

function toast(text){
    const el=document.getElementById("toast");
    el.textContent=text;
    el.classList.add("show");

    setTimeout(()=>el.classList.remove("show"),2200);
}

function randomCard(){
    let a=[];
    for(let i=0;i<4;i++)
        a.push(Math.floor(1000+Math.random()*9000));

    return a.join(" ");
}

function today(){
    return new Date().toLocaleDateString("ru-RU");
}

function addTx(title,amount,icon="💳"){
    account.transactions.unshift({
        title,
        amount,
        icon,
        date:today()
    });

    account.transactions=account.transactions.slice(0,20);
}

/* =========================================================
   AUTH
========================================================= */

function authScreen(register=false){

    document.body.innerHTML=`
        <div class="auth">
            <div class="authBox">

                <div class="authLogo">svtvn банк</div>

                <h1>${register?"Создать аккаунт":"Войти в аккаунт"}</h1>

                <p>
                    ${register?
                    "Создайте банковский аккаунт. Это локальный демонстрационный банк.":
                    "Введите данные своего аккаунта."}
                </p>

                ${register?`
                    <input id="regName" class="input"
                        placeholder="Имя и фамилия">

                    <input id="regUsername" class="input"
                        placeholder="Юзернейм">

                    <input id="regLogin" class="input"
                        placeholder="Логин">

                    <input id="regPass" class="input"
                        type="password"
                        placeholder="Пароль">

                    <input id="regPin" class="input"
                        inputmode="numeric"

function pinScreen(){

                ).join("")}

        </div>
    `;

    window.pinValue="";
}

window.enterPin=function(n){

    if(window.pinValue.length>=4)return;

    sound("click");

    window.pinValue+=n;

    updateDots();

    if(window.pinValue.length===4){

        setTimeout(()=>{

            if(window.pinValue===account.pin){

                sound("success");
                render();

            }else{

                sound("error");

                const screen=document.querySelector(".pinScreen");
                screen.classList.add("shake");

                setTimeout(()=>screen.classList.remove("shake"),400);

                window.pinValue="";
                updateDots();
            }

        },130);
    }
};

window.deletePin=function(){
    window.pinValue=window.pinValue.slice(0,-1);
    updateDots();
};

function updateDots(){

    document.querySelectorAll(".dot").forEach((d,i)=>{
        d.classList.toggle(
            "filled",
            i<window.pinValue.length
        );
    });
}

                        ).join("")}

                ${Array.from({length:25},(_,i)=>{

                    let cls="mineCell";
                    let icon="";

                    if(m.opened.includes(i)){
                        cls+=" open";

                        if(m.minePositions.includes(i)){
                            cls+=" boom";
                            icon="💥";
                        }else{
                            cls+=" win";
                            icon="💎";
                        }
                    }

                    return `
                        <button class="${cls}"
                                onclick="clickMine(${i})">
                            ${icon}
                        </button>
                    `;

                }).join("")}

            </div>

            ${
                m.active?
                `<button class="btn"
                         onclick="cashoutMines()">
                    Забрать ${money(m.bet*m.multiplier)}
                 </button>`
                :
                `<button class="btn"
                         onclick="startMines()">
                    Начать игру
                 </button>`
            }

            <p style="color:var(--muted);font-size:12px;text-align:center">
                Ставка списывается один раз при начале игры.
                Выигрыш не зачисляется до кнопки «Забрать».
            </p>

        </div>
    `;
}

window.setMineBet=function(n){
    document.getElementById("mineBet").value=n;
};

window.startMines=function(){

    const bet=Number(document.getElementById("mineBet").value);
    const mines=Number(document.getElementById("mineCount").value);

    if(bet<=0||bet>account.balance){
        toast("Недостаточно средств");
        sound("error");
        return;
    }

    /* СТАВКА СПИСЫВАЕТСЯ ТОЛЬКО ЗДЕСЬ */
    account.balance-=bet;

    let positions=[];

    while(positions.length<mines){

        const x=Math.floor(Math.random()*25);

        if(!positions.includes(x))
            positions.push(x);
    }

    state.mines={
        active:true,
        bet,
        mines,
        opened:[],
        minePositions:positions,
        multiplier:1
    };

    addTx("Ставка — Мины",-bet,"💣");

    save();

    sound("click");
    renderCasinoGame();

    updateTopBalance();
};

window.clickMine=function(index){

    const m=state.mines;

    if(!m||!m.active||m.opened.includes(index))
        return;

    m.opened.push(index);

    if(m.minePositions.includes(index)){

        sound("boom");

        m.active=false;

        toast("💥 Вы проиграли");

        renderCasinoGame();
        updateTopBalance();

        return;
    }

    sound("success");

    const safeOpened=m.opened.length;

    m.multiplier=
        1+
        safeOpened*(0.16+
        m.mines*.025);

    renderCasinoGame();
};

window.cashoutMines=function(){

    const m=state.mines;

    if(!m||!m.active)return;

    const winnings=m.bet*m.multiplier;

    /* ВЫИГРЫШ НАЧИСЛЯЕТСЯ ТОЛЬКО ЗДЕСЬ */
    account.balance+=winnings;

    addTx("Выигрыш — Мины",winnings,"💎");

    state.mines=null;

    save();

    sound("win");

    toast("Вы забрали "+money(winnings));

    renderCasinoGame();
    updateTopBalance();
};

window.spinUpgrade=function(){

    if(state.upgraderSpinning)return;

    const bet=Number(document.getElementById("upgradeBet").value);

    if(bet<=0||bet>account.balance){
        toast("Недостаточно средств");
        sound("error");
        return;
    }

    /* Ставка списывается ДО вращения */
    account.balance-=bet;

    addTx("Ставка — Upgrader",-bet,"🎡");

    save();

    state.upgraderSpinning=true;

    renderCasinoGame();
    updateTopBalance();

    const wheel=document.getElementById("upgradeWheel");

    const win=Math.random()<.5;

    /*
       wheel заканчивается либо на зелёной,
       либо на красной половине
    */
    const finalAngle=win?
        360*5+Math.floor(Math.random()*150):
        360*5+180+Math.floor(Math.random()*150);

    setTimeout(()=>{

        wheel.style.transform=
            `rotate(${finalAngle}deg)`;

        sound("click");

    },50);

    setTimeout(()=>{

        state.upgraderSpinning=false;

        if(win){

            const winnings=bet*2;

            account.balance+=winnings;

            addTx(
                "Выигрыш — Upgrader",
                winnings,
                "🎉"
            );

            sound("win");

            toast("🎉 Победа! +"+money(winnings));

        }else{

            sound("boom");

            toast("💥 Не повезло");

        }

        save();

        renderCasinoGame();
        updateTopBalance();

    },3700);
};

            </div>

        </div>

        <div class="crashStatus">

            ${
                c.phase==="bet"?
                `Сделайте ставку — ${c.countdown} сек.`:
                c.phase==="flying"?
                `Ракета летит...`:
                `РАКЕТА ВЗОРВАЛАСЬ`
            }

            </div>

                   class="betInput"
                   type="number"
                   value="1000">

        </div>

        ${
            c.phase==="bet"?

            `<button class="btn"
                     onclick="placeCrashBet()">
                Поставить
             </button>`:

            c.phase==="flying"?

            `<button class="btn"
                     onclick="cashoutCrash()">
                Забрать ×${c.multiplier.toFixed(2)}
             </button>`:

            `<button class="btn"
                     onclick="restartCrash()">
                Новая игра
             </button>`
        }

    </div>
    `;

window.placeCrashBet=function(){

    const bet=Number(document.getElementById("crashBet").value);

    if(bet<=0||bet>account.balance){
        toast("Недостаточно средств");
        sound("error");
        return;
    }

    account.balance-=bet;

    addTx("Ставка — Crash",-bet,"🚀");

    state.crash.bet=bet;

    save();

    sound("click");

    startCrashCountdown();

    renderCasinoGame();
    updateTopBalance();
};

function startCrashCountdown(){

    let left=10;

    state.crash.phase="bet";

    state.crash.timer=setInterval(()=>{

        left--;

        state.crash.countdown=left;

        if(left<=0){

            clearInterval(state.crash.timer);

            launchCrash();

        }

        renderCasinoGame();

    },1000);
}

function launchCrash(){

    const c=state.crash;

    c.phase="flying";
    c.multiplier=1;

    /*
       Рандомный crash point.
       Диапазон примерно 1.00x–10.00x.
    */
    c.crashPoint=
        1+
        Math.random()*9;

    let start=Date.now();

    c.timer=setInterval(()=>{

        const elapsed=(Date.now()-start)/1000;

        c.multiplier=
            1+
            Math.pow(elapsed,1.45)*.42;

        if(c.multiplier>=c.crashPoint){

            c.multiplier=c.crashPoint;

            clearInterval(c.timer);

            crashEnd();

            return;
        }

        renderCasinoGame();

    },100);

    renderCasinoGame();
}

window.cashoutCrash=function(){

    const c=state.crash;

    if(!c||c.phase!=="flying"||c.cashed)
        return;

    c.cashed=true;

    clearInterval(c.timer);

    const winnings=
        c.bet*c.multiplier;

    account.balance+=winnings;

    addTx(
        "Выигрыш — Crash",
        winnings,
        "🚀"
    );

    sound("win");

    toast(
        "Забрано "+money(winnings)
    );

    c.phase="bet";

    save();

    renderCasinoGame();
    updateTopBalance();
};

function crashEnd(){

    const c=state.crash;

    c.phase="crashed";

    sound("boom");

    if(!c.cashed)
        toast("💥 КРАШ!");

    renderCasinoGame();
}

window.restartCrash=function(){

    state.crash={
        phase:"bet",
        countdown:10,
        bet:0,
        multiplier:1,
        cashed:false,
        timer:null
    };

    renderCasinoGame();
};

/* =========================================================
   EXIT CASINO
========================================================= */

window.exitCasino=function(){

    /*
      Если игра активна, не позволяем случайно
      забрать виртуальный выигрыш.
    */
    if(state.mines?.active){
        toast("Сначала заберите выигрыш");
        return;
    }

    if(state.crash?.phase==="flying"){
        toast("Игра ещё идёт");
        return;
    }

    state.casinoMode=null;
    state.mines=null;
    state.crash=null;

    render();
};

/* =========================================================
   CLICKER
========================================================= */

function clickerPage(){

    if(state.page!=="clicker")
        return `<section class="page"></section>`;

    return `
    <section class="page active">

        <div class="sectionTitle">
            Заработок
        </div>

        <div style="color:var(--muted)">
            Нажимай и получай по 1 ₽
        </div>

        <div class="clicker">

            <div id="coin"
                 class="coin"
                 onclick="clickMoney(event)">

            </div>

        </div>

        <div class="card"
             style="text-align:center">

            <div style="color:var(--muted)">
                Заработано кликами
            </div>

            <div style="font-size:30px;font-weight:900;margin-top:5px">
                ${money(account.clicker)}
            </div>

window.clickMoney=function(e){

    account.balance+=1;
    account.clicker+=1;

    sound("money");

    addTx("Кликер",1,"₽");

    save();

    const el=document.createElement("div");

    el.className="floatMoney";
    el.textContent="+1 ₽";

    el.style.left=(e.clientX-20)+"px";
    el.style.top=(e.clientY-30)+"px";

    document.body.appendChild(el);

    setTimeout(()=>el.remove(),1000);

    render();
};

/* =========================================================
   CARD
========================================================= */

                    svtvn банк
                </div>

                <div style="margin-top:50px">
                    ${account.card}
                </div>

                    ${account.name.toUpperCase()}

};

/* =========================================================
   DELETE ACCOUNT
========================================================= */

window.deleteAccount=function(){

    modal(`
        <h2>Удалить аккаунт?</h2>

        <p style="color:var(--muted)">
            Это действие удалит аккаунт, баланс,
            карту, историю операций и настройки
            из этого браузера.
        </p>

        <button class="btn dangerBtn"
                onclick="confirmDelete()">
            Удалить аккаунт
        </button>

        <button class="btn secondary"
                onclick="closeModal()">
            Отмена
        </button>
    `);
};

window.confirmDelete=function(){

    localStorage.removeItem(KEY);

    account=null;

    closeModal();

    sound("boom");

    setTimeout(()=>{
        authScreen(true);
    },200);
};

/* =========================================================
   LOGOUT
========================================================= */

window.logout=function(){

    if(!account)return;

    pinScreen();
};

/* =========================================================
   MODAL
========================================================= */

function modal(html){

    const old=document.getElementById("modal");

    if(old)old.remove();

    const m=document.createElement("div");

    m.id="modal";
    m.className="modal show";

    m.innerHTML=`
        <div class="sheet">
            ${html}
        </div>
    `;

    document.body.appendChild(m);
}

window.closeModal=function(){

    const m=document.getElementById("modal");

    if(m)m.remove();
};

/* =========================================================
   TOP BALANCE
========================================================= */

function updateTopBalance(){

    const el=document.querySelector(".topBalance");

    if(el)
        el.textContent=money(account.balance);
}

/* =========================================================
   START
========================================================= */

if(!account){

    authScreen(true);

}else{

    pinScreen();

}

</script>
