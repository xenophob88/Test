<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>SVTVN BANK</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#080a0f;
    --card:#11151d;
    --card2:#191e28;
    --text:#f7f8fb;
    --muted:#8d96a5;
    --accent:#087cff;
    --accent2:#61b0ff;
    --green:#21d789;
    --red:#ff4d5a;
    --yellow:#ffd45c;
    --border:rgba(255,255,255,.08);
    --shadow:0 20px 60px rgba(0,0,0,.38);
}

html,body{
    margin:0;
    min-height:100%;
    background:var(--bg);
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
    "Segoe UI",sans-serif;
    color:var(--text);
    overflow-x:hidden;
    transition:.45s;
}

button,input,select{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
    color:inherit;
}

.app{
    width:100%;
    max-width:520px;
    margin:auto;
    min-height:100vh;
    padding-bottom:105px;
}

/* TOP */

.top{
    height:76px;
    padding:17px 18px 10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:50;
    backdrop-filter:blur(25px);
    background:rgba(8,10,15,.76);
}

.logo{
    font-size:20px;
    font-weight:850;
    padding:9px 18px;
    border-radius:22px;
    background:var(--accent);
    box-shadow:0 0 35px color-mix(in srgb,var(--accent) 35%,transparent);
    animation:logoFloat 4s ease-in-out infinite;
}

@keyframes logoFloat{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-3px)}
}

.topBalance{
    font-weight:800;
    font-size:15px;
}

/* PAGE */

.page{
    display:none;
    padding:15px 18px;
    animation:pageIn .35s ease;
}

.page.active{
    display:block;
}

@keyframes pageIn{
    from{
        opacity:0;
        transform:translateY(18px);
    }
    to{
        opacity:1;
        transform:none;
    }
}

/* HOME */

.greeting{
    margin-top:12px;
    font-size:29px;
    font-weight:850;
    letter-spacing:-1px;
}

.sub{
    color:var(--muted);
    margin-top:5px;
}

.balanceCard{
    margin-top:25px;
    padding:25px;
    min-height:210px;
    border-radius:30px;
    position:relative;
    overflow:hidden;

    background:
        linear-gradient(
            135deg,
            color-mix(in srgb,var(--accent) 96%,black),
            color-mix(in srgb,var(--accent) 35%,#111)
        );

    box-shadow:
        0 20px 65px color-mix(in srgb,var(--accent) 22%,transparent);

    animation:cardIdle 5s ease-in-out infinite;
}

@keyframes cardIdle{
    0%,100%{transform:translateY(0) rotateX(0)}
    50%{transform:translateY(-4px) rotateX(1deg)}
}

.balanceCard:before{
    content:"";
    position:absolute;
    width:280px;
    height:280px;
    border-radius:50%;
    background:rgba(255,255,255,.1);
    right:-110px;
    top:-145px;
}

.balanceCard:after{
    content:"";
    position:absolute;
    width:180px;
    height:180px;
    border-radius:50%;
    background:rgba(255,255,255,.05);
    left:-100px;
    bottom:-110px;
}

.balanceLabel{
    color:rgba(255,255,255,.72);
}

.balance{
    font-size:43px;
    font-weight:900;
    margin-top:15px;
    letter-spacing:-2px;
}

.cardName{
    position:absolute;
    bottom:22px;
    left:25px;
    font-size:14px;
    opacity:.88;
}

.cardNumber{
    position:absolute;
    bottom:22px;
    right:25px;
    font-size:13px;
    opacity:.7;
}

/* ACTIONS */

.actions{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-top:18px;
}

.action{
    padding:15px 5px;
    border-radius:20px;
    background:var(--card);
    border:1px solid var(--border);
    text-align:center;
    transition:.2s;
}

.action:active{
    transform:scale(.91);
}

.actionIcon{
    font-size:24px;
    margin-bottom:6px;
}

.actionText{
    font-size:11px;
    color:var(--muted);
}

/* CARDS */

.sectionTitle{
    font-size:21px;
    font-weight:850;
    margin:27px 0 12px;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:25px;
    padding:18px;
    box-shadow:var(--shadow);
}

/* TRANSACTIONS */

.transaction{
    display:flex;
    align-items:center;
    gap:13px;
    padding:13px 0;
    border-bottom:1px solid var(--border);
}

.transaction:last-child{
    border-bottom:0;
}

.txIcon{
    width:44px;
    height:44px;
    border-radius:15px;
    display:grid;
    place-items:center;
    background:var(--card2);
}

.txInfo{
    flex:1;
}

.txTitle{
    font-weight:700;
}

.txDate{
    color:var(--muted);
    font-size:12px;
    margin-top:3px;
}

.plus{
    color:var(--green);
}

.minus{
    color:var(--red);
}

/* NAV */

.nav{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:min(520px,100%);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    display:grid;
    grid-template-columns:repeat(5,1fr);
    background:rgba(10,12,17,.88);
    backdrop-filter:blur(28px);
    border-top:1px solid var(--border);
    z-index:100;
}

.navBtn{
    background:none;
    color:var(--muted);
    padding:7px 0;
    transition:.25s;
}

.navBtn.active{
    color:var(--accent2);
    transform:translateY(-3px);
}

.navIcon{
    font-size:21px;
}

.navText{
    font-size:10px;
    margin-top:3px;
}

/* PROFILE */

.profileHead{
    text-align:center;
    padding:20px 0;
}

.avatar{
    width:90px;
    height:90px;
    margin:auto;
    border-radius:50%;
    display:grid;
    place-items:center;
    font-size:34px;
    font-weight:850;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );

    box-shadow:
        0 0 45px color-mix(in srgb,var(--accent) 32%,transparent);

    animation:avatarIdle 4s ease-in-out infinite;
}

@keyframes avatarIdle{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-5px)}
}

.profileName{
    font-size:25px;
    font-weight:850;
    margin-top:13px;
}

.username{
    color:var(--muted);
}

.menuItem{
    width:100%;
    background:var(--card);
    padding:17px;
    border-radius:19px;
    margin-top:9px;
    display:flex;
    align-items:center;
    gap:13px;
    text-align:left;
    border:1px solid var(--border);
    transition:.2s;
}

.menuItem:active{
    transform:scale(.97);
}

.menuItem span:last-child{
    margin-left:auto;
    color:var(--muted);
}

.danger{
    color:#ff5663;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(16px);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:200;
}

.modal.show{
    display:flex;
}

.sheet{
    width:min(520px,100%);
    background:var(--card);
    border-radius:30px 30px 0 0;
    padding:25px;
    padding-bottom:calc(25px + env(safe-area-inset-bottom));
    animation:sheetIn .3s ease;
    max-height:90vh;
    overflow:auto;
}

@keyframes sheetIn{
    from{transform:translateY(100%)}
    to{transform:none}
}

.input{
    width:100%;
    padding:16px;
    margin-top:10px;
    background:var(--card2);
    border:1px solid var(--border);
    border-radius:17px;
    color:var(--text);
    outline:none;
}

.btn{
    width:100%;
    padding:17px;
    margin-top:12px;
    border-radius:18px;
    background:var(--accent);
    font-weight:850;
    transition:.2s;
}

.btn:active{
    transform:scale(.96);
}

.btn:disabled{
    opacity:.45;
}

.btn.secondary{
    background:var(--card2);
}

.btn.dangerBtn{
    background:var(--red);
}

/* AUTH */

.auth{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;
}

.authBox{
    width:100%;
    max-width:420px;
    animation:pageIn .6s ease;
}

.authLogo{
    text-align:center;
    font-size:30px;
    font-weight:900;
    margin-bottom:30px;
}

.authBox h1{
    font-size:32px;
}

.authBox p{
    color:var(--muted);
}

.authSwitch{
    text-align:center;
    color:var(--accent2);
    margin-top:20px;
}

/* PIN */

.pinScreen{
    min-height:100vh;
    background:#1b1f24;
    color:#f5f5f7;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:20vh;
}

.pinLogo{
    background:#087cff;
    padding:7px 20px;
    border-radius:24px;
    font-size:25px;
    font-weight:800;
}

.pinName{
    margin-top:90px;
    font-size:34px;
    font-weight:850;
}

.dots{
    display:flex;
    gap:28px;
    margin-top:55px;
}

.dot{
    width:13px;
    height:13px;
    border-radius:50%;
    background:#85878a;
    transition:.15s;
}

.dot.filled{
    background:white;
    transform:scale(1.15);
}

.pinKeys{
    width:100%;
    max-width:450px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    margin-top:130px;
    row-gap:35px;
}

.pinKey{
    background:none;
    font-size:57px;
    color:#f5f5f7;
    transition:.12s;
}

.pinKey:active{
    transform:scale(.8);
    opacity:.5;
}

.pinBottom{
    position:absolute;
    bottom:55px;
    color:#aaa;
    font-size:17px;
}

.shake{
    animation:shake .35s;
}

@keyframes shake{
    20%{transform:translateX(-12px)}
    40%{transform:translateX(12px)}
    60%{transform:translateX(-8px)}
    80%{transform:translateX(8px)}
}

/* CASINO */

.casinoHero{
    padding:22px;
    border-radius:27px;
    background:
        radial-gradient(
            circle at 80% 20%,
            rgba(0,122,255,.2),
            transparent 35%
        ),
        linear-gradient(135deg,#171b22,#101116);

    overflow:hidden;
    position:relative;
}

.casinoHero h1{
    font-size:30px;
    margin:0;
}

.casinoHero p{
    color:var(--muted);
}

.games{
    display:grid;
    gap:12px;
    margin-top:17px;
}

.gameCard{
    min-height:120px;
    padding:20px;
    border-radius:24px;
    background:var(--card);
    border:1px solid var(--border);
    position:relative;
    overflow:hidden;
    transition:.25s;
}

.gameCard:active{
    transform:scale(.97);
}

.gameEmoji{
    font-size:35px;
}

.gameName{
    font-size:20px;
    font-weight:850;
    margin-top:8px;
}

.gameDesc{
    color:var(--muted);
    font-size:12px;
}

.gameGlow{
    position:absolute;
    width:130px;
    height:130px;
    right:-40px;
    top:-30px;
    border-radius:50%;
    background:var(--accent);
    filter:blur(45px);
    opacity:.3;
}

/* GAME */

.gameHeader{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:18px;
}

.back{
    background:var(--card);
    width:42px;
    height:42px;
    border-radius:15px;
}

.gameTitle{
    font-size:25px;
    font-weight:850;
}

.betBox{
    background:var(--card);
    padding:17px;
    border-radius:23px;
    border:1px solid var(--border);
}

.betLabel{
    color:var(--muted);
    font-size:13px;
}

.betInput{
    width:100%;
    border:0;
    background:none;
    color:var(--text);
    outline:none;
    font-size:30px;
    font-weight:850;
    margin-top:5px;
}

.betPresets{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
    margin-top:10px;
}

.preset{
    padding:9px;
    border-radius:12px;
    background:var(--card2);
}

/* MINES */

.minesGrid{
    margin-top:18px;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
}

.mineCell{
    aspect-ratio:1;
    border-radius:15px;
    background:linear-gradient(145deg,#202631,#11151c);
    border:1px solid rgba(255,255,255,.06);
    display:grid;
    place-items:center;
    font-size:25px;
    transition:.18s;
    box-shadow:inset 0 2px 5px rgba(255,255,255,.03);
}

.mineCell:active{
    transform:scale(.9);
}

.mineCell.open{
    background:linear-gradient(145deg,#28303c,#171b23);
    animation:mineOpen .25s ease;
}

@keyframes mineOpen{
    from{
        transform:scale(.7);
        opacity:0;
    }
    to{
        transform:none;
        opacity:1;
    }
}

.mineCell.win{
    background:rgba(33,215,137,.15);
    border-color:var(--green);
}

.mineCell.boom{
    background:rgba(255,77,90,.2);
    border-color:var(--red);
    animation:boom .45s;
}

@keyframes boom{
    30%{transform:scale(1.15)}
    60%{transform:scale(.85)}
}

/* UPGRADER */

.wheelWrap{
    width:280px;
    height:280px;
    margin:35px auto;
    position:relative;
}

.wheel{
    width:100%;
    height:100%;
    border-radius:50%;

    background:
        conic-gradient(
            #21d789 0deg 180deg,
            #ff4d5a 180deg 360deg
        );

    box-shadow:
        0 0 45px rgba(33,215,137,.18),
        inset 0 0 25px rgba(0,0,0,.3);

    transition:
        transform 3.5s cubic-bezier(.12,.75,.2,1);
}

.wheel:before{
    content:"";
    position:absolute;
    inset:10px;
    border-radius:50%;
    border:3px solid rgba(255,255,255,.15);
}

.wheel:after{
    content:"50%";
    position:absolute;
    width:100px;
    height:100px;
    border-radius:50%;
    background:#151820;
    top:90px;
    left:90px;
    display:grid;
    place-items:center;
    font-size:23px;
    font-weight:900;
    box-shadow:0 0 25px rgba(0,0,0,.45);
}

.pointer{
    position:absolute;
    top:-20px;
    left:50%;
    transform:translateX(-50%);
    width:0;
    height:0;

    border-left:13px solid transparent;
    border-right:13px solid transparent;
    border-top:30px solid white;

    z-index:5;
    filter:drop-shadow(0 3px 5px black);
}

/* CRASH */

.crashArena{
    margin-top:18px;
    height:310px;
    border-radius:25px;
    overflow:hidden;
    position:relative;

    background:
        radial-gradient(
            circle at 70% 25%,
            rgba(0,140,255,.2),
            transparent 30%
        ),
        linear-gradient(#080b12,#111723);

    border:1px solid var(--border);
}

.stars{
    position:absolute;
    inset:0;

    background-image:
        radial-gradient(circle,white 1px,transparent 1px);

    background-size:55px 55px;
    opacity:.15;

    animation:starsMove 7s linear infinite;
}

@keyframes starsMove{
    from{background-position:0 0}
    to{background-position:55px 55px}
}

.rocket{
    position:absolute;
    font-size:55px;
    left:15%;
    bottom:15%;
    transform:rotate(-35deg);

    filter:
        drop-shadow(0 0 20px #299dff);

    transition:
        left .12s linear,
        bottom .12s linear;
}

.crashX{
    position:absolute;
    top:40%;
    width:100%;
    text-align:center;
    font-size:52px;
    font-weight:900;
}

.crashStatus{
    text-align:center;
    margin-top:12px;
    color:var(--muted);
}

/* CLICKER */

.clicker{
    height:330px;
    display:grid;
    place-items:center;
    position:relative;
}

.coin{
    width:190px;
    height:190px;
    border-radius:50%;

    display:grid;
    place-items:center;

    font-size:65px;

    background:
        linear-gradient(
            145deg,
            #ffd85b,
            #e99c00
        );

    box-shadow:
        0 0 50px rgba(255,193,7,.25),
        inset 0 5px 10px rgba(255,255,255,.3);

    animation:coinIdle 2.5s ease-in-out infinite;

    user-select:none;

    transition:.12s;
}

.coin:active{
    transform:scale(.86) rotate(-5deg);
}

@keyframes coinIdle{
    0%,100%{
        transform:translateY(0) rotate(-2deg);
    }

    50%{
        transform:translateY(-9px) rotate(2deg);
    }
}

.floatMoney{
    position:fixed;
    font-size:25px;
    color:#ffd34d;
    font-weight:900;
    pointer-events:none;
    animation:moneyFloat 1s forwards;
    z-index:999;
}

@keyframes moneyFloat{
    from{
        opacity:1;
        transform:translateY(0) scale(.8);
    }

    to{
        opacity:0;
        transform:translateY(-100px) scale(1.2);
    }
}

/* TOAST */

.toast{
    position:fixed;
    left:50%;
    top:80px;

    transform:
        translateX(-50%)
        translateY(-20px);

    background:#242933;
    padding:13px 18px;
    border-radius:18px;

    opacity:0;
    pointer-events:none;

    z-index:500;

    transition:.3s;

    box-shadow:
        0 10px 35px rgba(0,0,0,.35);
}

.toast.show{
    opacity:1;
    transform:
        translateX(-50%)
        translateY(0);
}

/* THEMES */

body.theme-midnight{
    --bg:#07090e;
    --card:#10141c;
    --card2:#171c25;
    --accent:#087cff;
    --accent2:#61b0ff;
}

body.theme-graphite{
    --bg:#0b0b0d;
    --card:#151518;
    --card2:#202024;
    --accent:#b9bcc4;
    --accent2:#f1f1f4;
}

body.theme-slate{
    --bg:#0b1118;
    --card:#121b25;
    --card2:#1b2734;
    --accent:#5e9dff;
    --accent2:#9ac4ff;
}

body.theme-ocean{
    --bg:#061116;
    --card:#0c1b22;
    --card2:#122933;
    --accent:#00a9d8;
    --accent2:#54d9ff;
}

body.theme-forest{
    --bg:#07100b;
    --card:#0e1a12;
    --card2:#16251a;
    --accent:#24b86d;
    --accent2:#6be6a4;
}

body.theme-light{
    --bg:#f2f4f8;
    --card:#ffffff;
    --card2:#edf0f5;
    --text:#111318;
    --muted:#737a88;
    --accent:#087cff;
    --accent2:#55aaff;
    --border:rgba(0,0,0,.07);
}

/* RESPONSIVE */

@media(max-width:380px){

    .balance{
        font-size:36px;
    }

    .coin{
        width:160px;
        height:160px;
    }

    .wheelWrap{
        width:240px;
        height:240px;
    }

    .wheel:after{
        width:85px;
        height:85px;
        top:77px;
        left:77px;
    }
}
</style>
</head>

<body>

<div id="root"></div>
<div id="toast" class="toast"></div>

<script>

const KEY="svtvn_bank_account_v5";

let account=JSON.parse(
    localStorage.getItem(KEY)||"null"
);

let state={
    page:"home",
    casinoMode:null,

    mines:null,

    upgraderSpinning:false,
    upgraderRotation:0,

    crash:null
};

/* ================= SOUND ================= */

let audioCtx=null;

function sound(type="click"){

    try{

        if(!audioCtx){

            audioCtx=
                new(window.AudioContext||
                window.webkitAudioContext)();
        }

        const o=
            audioCtx.createOscillator();

        const g=
            audioCtx.createGain();

        o.connect(g);
        g.connect(audioCtx.destination);

        let freq=500;

        if(type==="success")freq=760;
        if(type==="error")freq=130;
        if(type==="money")freq=900;
        if(type==="win")freq=1100;
        if(type==="boom")freq=80;

        o.frequency.value=freq;

        o.type=
            type==="boom"
            ?"sawtooth"
            :"sine";

        g.gain.setValueAtTime(
            .001,
            audioCtx.currentTime
        );

        g.gain.exponentialRampToValueAtTime(
            .09,
            audioCtx.currentTime+.02
        );

        g.gain.exponentialRampToValueAtTime(
            .001,
            audioCtx.currentTime+.18
        );

        o.start();

        o.stop(
            audioCtx.currentTime+.2
        );

    }catch(e){}
}

/* ================= HELPERS ================= */

function save(){
    localStorage.setItem(
        KEY,
        JSON.stringify(account)
    );
}

function money(n){

    return Number(n||0).toLocaleString(
        "ru-RU",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    )+" ₽";
}

function toast(text){

    const el=
        document.getElementById("toast");

    el.textContent=text;

    el.classList.add("show");

    setTimeout(
        ()=>el.classList.remove("show"),
        2200
    );
}

function today(){

    return new Date()
        .toLocaleDateString("ru-RU");
}

function randomCard(){

    let a=[];

    for(let i=0;i<4;i++){

        a.push(
            Math.floor(
                1000+
                Math.random()*9000
            )
        );
    }

    return a.join(" ");
}

function escapeHTML(str){

    return String(str)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function addTx(title,amount,icon="💳"){

    account.transactions.unshift({

        title,
        amount,
        icon,
        date:today()

    });

    account.transactions=
        account.transactions.slice(0,30);
}

window.enterPin=function(n){

    if(window.pinValue.length>=4)
        return;

    sound("click");

    window.pinValue+=n;

    updateDots();

    if(window.pinValue.length===4){

        setTimeout(()=>{

            if(window.pinValue===account.pin){

                sound("success");

                render();

            }else{

                sound("error");

                const screen=
                    document.querySelector(
                        ".pinScreen"
                    );

                screen.classList.add("shake");

                setTimeout(
                    ()=>screen.classList.remove("shake"),
                    400
                );

                window.pinValue="";

                updateDots();
            }

        },130);
    }
};

window.deletePin=function(){

    window.pinValue=
        window.pinValue.slice(0,-1);

    updateDots();
};

function updateDots(){

    document
        .querySelectorAll(".dot")
        .forEach((d,i)=>{

            d.classList.toggle(
                "filled",
                i<window.pinValue.length
            );

        });
}

window.setMineBet=function(n){

    const input=
        document.getElementById(
            "mineBet"
        );

    if(input)
        input.value=n;
};

window.startMines=function(){

    const bet=
        Number(
            document.getElementById(
                "mineBet"
            ).value
        );

    const mines=
        Number(
            document.getElementById(
                "mineCount"
            ).value
        );

    if(
        bet<=0||
        bet>account.balance
    ){

        toast(
            "Недостаточно средств"
        );

        sound("error");

        return;
    }

    account.balance-=bet;

    let positions=[];

    while(
        positions.length<mines
    ){

        const x=
            Math.floor(
                Math.random()*25
            );

        if(!positions.includes(x))
            positions.push(x);
    }

    state.mines={

        active:true,

        ended:false,

        bet,

        mines,

        opened:[],

        minePositions:positions,

        multiplier:1
    };

    addTx(
        "Ставка — Мины",
        -bet,
        "💣"
    );

    save();

    sound("click");

    renderCasinoGame();

    updateTopBalance();
};

window.clickMine=function(index){

    const m=state.mines;

    if(
        !m||
        !m.active||
        m.opened.includes(index)
    )
        return;

    m.opened.push(index);

    if(
        m.minePositions.includes(index)
    ){

        sound("boom");

        m.active=false;

        m.ended=true;

        toast(
            "💥 Вы проиграли"
        );

        renderCasinoGame();

        updateTopBalance();

        save();

        return;
    }

    sound("success");

    const safeOpened=
        m.opened.length;

    m.multiplier=
        1+
        safeOpened*
        (
            .16+
            m.mines*.025
        );

    renderCasinoGame();

window.spinUpgrade=function(){

    if(state.upgraderSpinning)
        return;

    const bet=
        Number(
            document.getElementById(
                "upgradeBet"
            ).value
        );

    if(
        bet<=0||
        bet>account.balance
    ){

        toast(
            "Недостаточно средств"
        );

        sound("error");

        return;
    }

    account.balance-=bet;

    addTx(
        "Ставка — Upgrader",
        -bet,
        "🎡"
    );

    save();

    state.upgraderSpinning=true;

    renderCasinoGame();

    updateTopBalance();

    const wheel=
        document.getElementById(
            "upgradeWheel"
        );

    const win=
        Math.random()<.5;

    const target=
        win?
        (
            270+
            Math.random()*150
        ):
        (
            90+
            Math.random()*150
        );

    const current=
        (
            state.upgraderRotation%360+
            360
        )%360;

    let delta=
        (target-current+360)%360;

    if(delta<180)
        delta+=360;

    state.upgraderRotation+=
        1800+
        delta;

    wheel.style.transform=
        `rotate(
        ${state.upgraderRotation}deg)`;

    sound("click");

    setTimeout(()=>{

        state.upgraderSpinning=false;

        if(win){

            const winnings=
                bet*2;

            account.balance+=
                winnings;

            addTx(
                "Выигрыш — Upgrader",
                winnings,
                "🎉"
            );

            sound("win");

            toast(
                "🎉 Победа! +"+
                money(winnings)
            );

        }else{

            sound("boom");

            toast(
                "💥 Не повезло"
            );
        }

        save();

        renderCasinoGame();

        updateTopBalance();

    },3650);
};

            </button>
            `

            :

            </button>

        }

window.placeCrashBet=function(){

    const bet=
        Number(
            document.getElementById(
                "crashBet"
            ).value
        );

    if(
        bet<=0||
        bet>account.balance
    ){

        toast(
            "Недостаточно средств"
        );

        sound("error");

        return;
    }

    const c=state.crash;

    c.bet=bet;

    c.cashed=false;

    c.phase="bet";

    c.countdown=10;

    account.balance-=bet;

    addTx(
        "Ставка — Crash",
        -bet,
        "🚀"
    );

    save();

    sound("click");

    startCrashCountdown();

    renderCasinoGame();

    updateTopBalance();
};

function startCrashCountdown(){

    const c=state.crash;

    if(c.countTimer)
        clearInterval(c.countTimer);

    c.countdown=10;

    c.countTimer=
        setInterval(()=>{

            c.countdown--;

            if(c.countdown<=0){

                clearInterval(
                    c.countTimer
                );

                c.countTimer=null;

                launchCrash();

            }else{

                renderCasinoGame();
            }

        },1000);
}

function launchCrash(){

    const c=state.crash;

    c.phase="flying";

    c.multiplier=1;

    c.crashPoint=
        Math.max(
            1.01,
            1+
            Math.random()*9
        );

    const start=
        performance.now();

    if(c.timer)
        clearInterval(c.timer);

    c.timer=
        setInterval(()=>{

            const elapsed=
                (
                    performance.now()-
                    start
                )/1000;

            c.multiplier=
                1+
                Math.pow(
                    elapsed,
                    1.45
                )*.42;

            const x=
                document.getElementById(
                    "crashX"
                );

            const r=
                document.getElementById(
                    "rocket"
                );

            if(x){

                x.textContent=
                    "X"+
                    c.multiplier.toFixed(2);
            }

            if(r){

                const progress=
                    Math.min(
                        1,
                        c.multiplier/
                        c.crashPoint
                    );

                r.style.left=
                    (
                        15+
                        progress*65
                    )+"%";

                r.style.bottom=
                    (
                        15+
                        progress*65
                    )+"%";
            }

            if(
                c.multiplier>=
                c.crashPoint
            ){

                c.multiplier=
                    c.crashPoint;

                clearInterval(c.timer);

                c.timer=null;

                crashEnd();
            }

        },50);

    renderCasinoGame();
}

window.cashoutCrash=function(){

    const c=state.crash;

    if(
        !c||
        c.phase!=="flying"||
        c.cashed
    )
        return;

    c.cashed=true;

    clearInterval(c.timer);

    c.timer=null;

    const winnings=
        c.bet*c.multiplier;

    account.balance+=
        winnings;

    addTx(
        "Выигрыш — Crash",
        winnings,
        "🚀"
    );

    sound("win");

    toast(
        "Забрано "+
        money(winnings)
    );

    c.phase="bet";

    c.bet=0;

    c.countdown=10;

    save();

    renderCasinoGame();

    updateTopBalance();
};

function crashEnd(){

    const c=state.crash;

    c.phase="crashed";

    sound("boom");

    if(!c.cashed){

        toast(
            "💥 КРАШ!"
        );
    }

    renderCasinoGame();
}

window.restartCrash=function(){

    if(state.crash?.timer)
        clearInterval(
            state.crash.timer
        );

    if(state.crash?.countTimer)
        clearInterval(
            state.crash.countTimer
        );

    state.crash={

        phase:"bet",

        countdown:10,

        bet:0,

        multiplier:1,

        cashed:false,

        timer:null,

        countTimer:null,

        crashPoint:0
    };

    renderCasinoGame();
};

/* ================= EXIT ================= */

function stopTransientTimers(){

    if(state.crash?.timer)
        clearInterval(
            state.crash.timer
        );

    if(state.crash?.countTimer)
        clearInterval(
            state.crash.countTimer
        );
}

window.exitCasino=function(){

    if(
        state.mines?.active
    ){

        toast(
            "Сначала заберите выигрыш"
        );

        return;
    }

    if(
        state.crash?.phase==="flying"
    ){

        toast(
            "Игра ещё идёт"
        );

        return;
    }

    stopTransientTimers();

    state.casinoMode=null;

    state.mines=null;

    state.crash=null;

    state.upgraderSpinning=false;

    render();
};
