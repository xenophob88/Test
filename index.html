<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#08090d">
<title>svtvn банк</title>

<style>
:root{
  --bg:#08090d;
  --bg2:#0e1017;
  --card:rgba(255,255,255,.075);
  --card2:rgba(255,255,255,.045);
  --border:rgba(255,255,255,.11);
  --text:#fff;
  --muted:#9297a7;
  --accent:#8b5cf6;
  --accent2:#c084fc;
  --success:#32d583;
  --danger:#ff4d67;
  --warning:#ffbd4a;
  --nav:rgba(12,13,19,.82);
  --shadow:0 20px 60px rgba(0,0,0,.35);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
  overflow-x:hidden;
}

body{
  min-height:100dvh;
}

button,input{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
  color:inherit;
}

input{
  outline:none;
}

.hidden{display:none!important}

#app{
  min-height:100dvh;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 15% 0%,color-mix(in srgb,var(--accent) 18%,transparent),transparent 32%),
    radial-gradient(circle at 100% 35%,color-mix(in srgb,var(--accent2) 10%,transparent),transparent 35%),
    var(--bg);
}

#app::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(120deg,transparent 0%,rgba(255,255,255,.015) 45%,transparent 65%);
  animation:bgMove 12s linear infinite;
}

@keyframes bgMove{
  0%{transform:translateX(-40%)}
  100%{transform:translateX(40%)}
}

/* AUTH */

.auth{
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  padding-top:max(24px,env(safe-area-inset-top));
  padding-bottom:max(24px,env(safe-area-inset-bottom));
  position:relative;
}

.auth-orb{
  position:absolute;
  width:260px;
  height:260px;
  border-radius:50%;
  background:var(--accent);
  filter:blur(100px);
  opacity:.2;
  top:5%;
  left:-90px;
  animation:orb 7s ease-in-out infinite alternate;
}

.auth-orb.two{
  left:auto;
  top:auto;
  right:-100px;
  bottom:0;
  background:var(--accent2);
  animation-delay:-3s;
}

@keyframes orb{
  from{transform:translate(0,0) scale(.9)}
  to{transform:translate(45px,60px) scale(1.15)}
}

.auth-box{
  width:min(430px,100%);
  padding:30px 22px;
  border:1px solid var(--border);
  border-radius:32px;
  background:rgba(13,15,22,.72);
  backdrop-filter:blur(30px);
  box-shadow:var(--shadow);
  animation:authIn .65s cubic-bezier(.2,.8,.2,1);
  position:relative;
  z-index:1;
}

@keyframes authIn{
  from{opacity:0;transform:translateY(25px) scale(.96)}
  to{opacity:1;transform:none}
}

.logo{
  font-size:28px;
  font-weight:850;
  letter-spacing:-1.5px;
}

.logo span{
  color:var(--accent2);
}

.auth-title{
  margin:38px 0 7px;
  font-size:30px;
  letter-spacing:-1px;
}

.auth-sub{
  margin:0 0 26px;
  color:var(--muted);
  line-height:1.45;
}

.field{
  margin-bottom:13px;
}

.field label{
  display:block;
  font-size:12px;
  color:var(--muted);
  margin:0 0 7px 4px;
}

.field input{
  width:100%;
  height:54px;
  border-radius:17px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.055);
  color:var(--text);
  padding:0 16px;
  transition:.2s;
}

.field input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 14%,transparent);
}

.primary{
  width:100%;
  min-height:54px;
  margin-top:8px;
  border-radius:17px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 12px 30px color-mix(in srgb,var(--accent) 30%,transparent);
  font-weight:800;
  transition:transform .15s,filter .2s;
}

.primary:active,
.action:active,
.nav-item:active,
.pin-key:active,
.coin:active{
  transform:scale(.95);
}

.primary:hover{filter:brightness(1.08)}

.switch-auth{
  margin-top:19px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

.switch-auth button{
  background:none;
  color:var(--accent2);
  font-weight:700;
}

/* PIN */

.pin-screen{
  min-height:100dvh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:25px;
}

.pin-wrap{
  width:min(390px,100%);
  text-align:center;
  animation:authIn .55s ease;
}

.pin-logo{
  font-size:29px;
  font-weight:900;
  letter-spacing:-1.5px;
  margin-bottom:55px;
}

.pin-user{
  color:var(--muted);
  margin-bottom:9px;
}

.pin-name{
  font-size:24px;
  font-weight:800;
  margin-bottom:20px;
}

.pin-dots{
  display:flex;
  justify-content:center;
  gap:13px;
  height:22px;
}

.pin-dot{
  width:12px;
  height:12px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.4);
  transition:.2s;
}

.pin-dot.active{
  background:var(--text);
  box-shadow:0 0 16px rgba(255,255,255,.4);
}

.pin-label{
  margin:16px 0 30px;
  color:var(--muted);
  font-size:14px;
}

.pin-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  max-width:310px;
  margin:auto;
}

.pin-key{
  height:68px;
  border-radius:22px;
  background:rgba(255,255,255,.07);
  border:1px solid var(--border);
  font-size:22px;
  font-weight:700;
  transition:.12s;
}

.pin-key:active{
  background:rgba(255,255,255,.14);
}

.pin-action{
  background:transparent;
  color:var(--muted);
  font-size:13px;
}

/* MAIN */

.shell{
  min-height:100dvh;
  width:min(100%,760px);
  margin:auto;
  padding:0 17px;
  padding-top:max(16px,env(safe-area-inset-top));
  padding-bottom:calc(100px + env(safe-area-inset-bottom));
}

.topbar{
  height:55px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.top-logo{
  font-size:21px;
  font-weight:900;
  letter-spacing:-1px;
}

.top-balance{
  color:var(--muted);
  font-size:13px;
  font-weight:700;
}

.top-balance strong{
  color:var(--text);
  margin-left:5px;
}

.page{
  animation:pageIn .4s cubic-bezier(.2,.8,.2,1);
}

@keyframes pageIn{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:none}
}

.greeting{
  margin:14px 2px 17px;
}

.greeting small{
  color:var(--muted);
  font-size:13px;
}

.greeting h1{
  margin:4px 0 0;
  font-size:30px;
  letter-spacing:-1.2px;
}

.balance-card{
  min-height:220px;
  padding:24px;
  border-radius:29px;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 85% 10%,rgba(255,255,255,.28),transparent 22%),
    linear-gradient(135deg,var(--accent),#24133e 70%);
  box-shadow:0 25px 65px color-mix(in srgb,var(--accent) 24%,transparent);
  animation:cardFloat 5s ease-in-out infinite;
}

@keyframes cardFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-3px)}
}

.balance-card::after{
  content:"";
  position:absolute;
  width:190px;
  height:190px;
  border-radius:50%;
  right:-80px;
  bottom:-100px;
  background:rgba(255,255,255,.12);
  filter:blur(3px);
}

.balance-label{
  opacity:.75;
  font-size:13px;
}

.balance-value{
  margin-top:5px;
  font-size:39px;
  font-weight:850;
  letter-spacing:-1.7px;
}

.card-mini{
  position:absolute;
  left:24px;
  right:24px;
  bottom:21px;
  display:flex;
  justify-content:space-between;
  align-items:end;
}

.card-number{
  font-size:15px;
  letter-spacing:2px;
  opacity:.92;
}

.card-owner{
  font-size:11px;
  opacity:.75;
  text-transform:uppercase;
  margin-bottom:3px;
}

.no-card{
  margin-top:33px;
  color:rgba(255,255,255,.7);
  font-size:14px;
}

.section-title{
  margin:25px 2px 13px;
  font-size:18px;
  font-weight:800;
  letter-spacing:-.4px;
}

.quick-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
}

.action{
  min-height:89px;
  border:1px solid var(--border);
  border-radius:20px;
  background:var(--card);
  backdrop-filter:blur(20px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:.16s;
}

.action .icon{
  width:38px;
  height:38px;
  border-radius:13px;
  display:grid;
  place-items:center;
  background:color-mix(in srgb,var(--accent) 17%,transparent);
  font-size:19px;
}

.action span:last-child{
  font-size:11px;
  font-weight:700;
  color:var(--muted);
}

.card-promo{
  padding:20px;
  border-radius:24px;
  background:var(--card);
  border:1px solid var(--border);
  margin-top:16px;
  display:flex;
  align-items:center;
  gap:15px;
}

.card-promo .promo-icon{
  width:48px;
  height:48px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  border-radius:16px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  font-size:22px;
}

.card-promo-content{
  flex:1;
}

.card-promo h3{
  margin:0 0 4px;
  font-size:15px;
}

.card-promo p{
  margin:0;
  color:var(--muted);
  font-size:12px;
  line-height:1.4;
}

.small-btn{
  padding:11px 13px;
  border-radius:13px;
  background:rgba(255,255,255,.1);
  font-size:11px;
  font-weight:800;
}

/* NAV */

.nav{
  position:fixed;
  z-index:30;
  left:50%;
  transform:translateX(-50%);
  bottom:0;
  width:min(100%,760px);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:var(--nav);
  border-top:1px solid var(--border);
  backdrop-filter:blur(28px);
  display:grid;
  grid-template-columns:repeat(5,1fr);
}

.nav-item{
  background:none;
  min-height:57px;
  border-radius:16px;
  color:#777c8c;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:5px;
  transition:.2s;
}

.nav-item.active{
  color:var(--text);
  background:color-mix(in srgb,var(--accent) 15%,transparent);
}

.nav-item .nav-icon{
  font-size:20px;
  line-height:20px;
  transition:.2s;
}

.nav-item.active .nav-icon{
  transform:translateY(-2px) scale(1.1);
}

.nav-item span:last-child{
  font-size:9px;
  font-weight:700;
}

/* CARDS */

.ui-card{
  border:1px solid var(--border);
  background:var(--card);
  border-radius:25px;
  padding:19px;
  margin-bottom:13px;
  backdrop-filter:blur(20px);
}

.ui-card h3{
  margin:0 0 5px;
  font-size:17px;
}

.ui-card p{
  margin:0;
  color:var(--muted);
  font-size:13px;
  line-height:1.45;
}

.form-input{
  width:100%;
  height:52px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.055);
  border-radius:16px;
  padding:0 15px;
  color:var(--text);
  margin:8px 0;
}

.form-label{
  color:var(--muted);
  font-size:12px;
  margin:12px 2px 0;
  display:block;
}

.form-btn{
  width:100%;
  min-height:52px;
  border-radius:16px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  font-weight:800;
  margin-top:8px;
}

.secondary-btn{
  width:100%;
  min-height:50px;
  border-radius:16px;
  background:rgba(255,255,255,.08);
  font-weight:700;
  margin-top:8px;
}

/* HISTORY */

.stats-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.stat{
  padding:16px;
  border-radius:20px;
  background:var(--card);
  border:1px solid var(--border);
}

.stat small{
  color:var(--muted);
  font-size:11px;
}

.stat strong{
  display:block;
  margin-top:6px;
  font-size:19px;
}

.chart-wrap{
  padding:15px;
  border-radius:24px;
  background:var(--card);
  border:1px solid var(--border);
  margin-top:12px;
  overflow:hidden;
}

#chart{
  width:100%;
  height:190px;
  display:block;
}

.transaction{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 2px;
  border-bottom:1px solid rgba(255,255,255,.06);
}

.transaction:last-child{border-bottom:0}

.tx-icon{
  width:42px;
  height:42px;
  border-radius:14px;
  display:grid;
  place-items:center;
  background:rgba(255,255,255,.07);
  flex:0 0 auto;
}

.tx-main{flex:1;min-width:0}

.tx-main strong{
  display:block;
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.tx-main small{
  color:var(--muted);
  font-size:10px;
}

.tx-amount{
  font-size:13px;
  font-weight:800;
}

.income{color:var(--success)}
.expense{color:var(--danger)}

.empty{
  text-align:center;
  padding:40px 15px;
  color:var(--muted);
}

/* PROFILE */

.profile-head{
  padding:25px 10px;
  text-align:center;
}

.avatar{
  width:82px;
  height:82px;
  margin:auto;
  border-radius:28px;
  display:grid;
  place-items:center;
  font-size:29px;
  font-weight:900;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 15px 40px color-mix(in srgb,var(--accent) 30%,transparent);
  animation:avatarFloat 4s ease-in-out infinite;
}

@keyframes avatarFloat{
  50%{transform:translateY(-4px) rotate(1deg)}
}

.profile-head h2{
  margin:13px 0 3px;
}

.profile-head p{
  margin:0;
  color:var(--muted);
}

.setting{
  min-height:62px;
  display:flex;
  align-items:center;
  gap:13px;
  border-bottom:1px solid rgba(255,255,255,.06);
}

.setting:last-child{border:0}

.setting-icon{
  width:40px;
  height:40px;
  border-radius:13px;
  display:grid;
  place-items:center;
  background:rgba(255,255,255,.07);
}

.setting-main{flex:1}

.setting-main strong{
  display:block;
  font-size:14px;
}

.setting-main small{
  color:var(--muted);
  font-size:11px;
}

.toggle{
  width:50px;
  height:30px;
  padding:3px;
  border-radius:20px;
  background:#383b46;
  transition:.2s;
}

.toggle i{
  display:block;
  width:24px;
  height:24px;
  border-radius:50%;
  background:#fff;
  transition:.2s;
}

.toggle.on{
  background:var(--accent);
}

.toggle.on i{
  transform:translateX(20px);
}

.danger-btn{
  width:100%;
  min-height:50px;
  margin-top:10px;
  border-radius:16px;
  background:rgba(255,77,103,.11);
  color:var(--danger);
  font-weight:800;
}

/* CASINO */

.casino-header{
  margin:17px 0 20px;
}

.casino-header h1{
  margin:0;
  font-size:31px;
  letter-spacing:-1px;
}

.casino-header p{
  margin:5px 0 0;
  color:var(--muted);
}

.casino-balance{
  margin-top:16px;
  font-weight:800;
}

.casino-grid{
  display:grid;
  gap:13px;
}

.casino-mode{
  min-height:135px;
  padding:21px;
  border-radius:27px;
  border:1px solid var(--border);
  position:relative;
  overflow:hidden;
  background:var(--card);
  transition:.2s;
  text-align:left;
}

.casino-mode:active{
  transform:scale(.975);
}

.casino-mode::before{
  content:"";
  position:absolute;
  width:130px;
  height:130px;
  border-radius:50%;
  right:-40px;
  top:-45px;
  background:var(--accent);
  opacity:.16;
  filter:blur(20px);
}

.casino-mode h2{
  margin:0;
  font-size:21px;
}

.casino-mode p{
  margin:7px 0 0;
  color:var(--muted);
  font-size:12px;
}

.casino-emoji{
  font-size:37px;
  display:block;
  margin-bottom:10px;
}

.casino-mode:nth-child(1) .casino-emoji{
  animation:bomb 2s ease-in-out infinite;
}

@keyframes bomb{
  50%{transform:rotate(-8deg) scale(1.08)}
}

.casino-mode:nth-child(2) .casino-emoji{
  animation:wheelIdle 2s linear infinite;
}

@keyframes wheelIdle{
  to{transform:rotate(360deg)}
}

.casino-mode:nth-child(3) .casino-emoji{
  animation:rocketIdle 1.5s ease-in-out infinite;
}

@keyframes rocketIdle{
  50%{transform:translate(5px,-5px)}
}

/* GAME */

.game-top{
  display:flex;
  align-items:center;
  gap:10px;
  margin:8px 0 17px;
}

.back-btn{
  width:42px;
  height:42px;
  border-radius:14px;
  background:rgba(255,255,255,.07);
  font-size:19px;
}

.game-title{
  font-size:21px;
  font-weight:850;
}

.game-balance{
  margin-left:auto;
  font-size:12px;
  color:var(--muted);
}

.game-balance strong{
  color:var(--text);
}

.mines-info{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:13px;
}

.mini-stat{
  text-align:center;
  padding:11px 5px;
  border:1px solid var(--border);
  background:var(--card);
  border-radius:16px;
}

.mini-stat small{
  color:var(--muted);
  font-size:9px;
  display:block;
}

.mini-stat strong{
  display:block;
  margin-top:3px;
  font-size:13px;
}

.mine-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
  max-width:460px;
  margin:auto;
}

.mine-cell{
  aspect-ratio:1;
  border-radius:14px;
  border:1px solid var(--border);
  background:
    linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.035));
  box-shadow:inset 0 1px rgba(255,255,255,.06);
  font-size:21px;
  transition:.2s;
  transform-style:preserve-3d;
}

.mine-cell:not(.opened):active{
  transform:scale(.9);
}

.mine-cell.opened{
  animation:tileOpen .32s ease;
}

@keyframes tileOpen{
  from{transform:rotateY(90deg) scale(.8)}
  to{transform:none}
}

.mine-cell.safe{
  background:rgba(50,213,131,.13);
  border-color:rgba(50,213,131,.35);
  box-shadow:0 0 20px rgba(50,213,131,.15);
}

.mine-cell.bomb{
  background:rgba(255,77,103,.18);
  border-color:rgba(255,77,103,.45);
  animation:mineBoom .5s ease;
}

@keyframes mineBoom{
  0%{transform:scale(.7)}
  50%{transform:scale(1.18) rotate(4deg)}
  100%{transform:none}
}

.game-controls{
  margin-top:16px;
}

.game-message{
  min-height:20px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
  margin:10px 0;
}

.bet-row{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
}

.bet-row input{
  height:52px;
  border-radius:16px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  padding:0 15px;
}

.select-row{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin-top:9px;
}

.select-btn{
  height:43px;
  border-radius:13px;
  background:rgba(255,255,255,.06);
  border:1px solid var(--border);
  font-size:12px;
  font-weight:700;
}

.select-btn.active{
  background:color-mix(in srgb,var(--accent) 22%,transparent);
  border-color:var(--accent);
}

/* UPGRADER */

.upgrader-wrap{
  text-align:center;
}

.wheel-area{
  width:min(310px,80vw);
  aspect-ratio:1;
  margin:15px auto 24px;
  position:relative;
}

.wheel{
  width:100%;
  height:100%;
  border-radius:50%;
  border:8px solid rgba(255,255,255,.13);
  background:conic-gradient(
    #2ed27b 0deg 180deg,
    #f0445c 180deg 360deg
  );
  box-shadow:
    0 0 45px rgba(255,255,255,.08),
    inset 0 0 30px rgba(0,0,0,.3);
  position:relative;
  transition:transform 4s cubic-bezier(.12,.75,.15,1);
}

.wheel::after{
  content:"";
  position:absolute;
  inset:23%;
  border-radius:50%;
  background:#12141b;
  border:2px solid rgba(255,255,255,.12);
  box-shadow:inset 0 0 25px rgba(0,0,0,.5);
}

.wheel-center{
  position:absolute;
  z-index:2;
  inset:0;
  display:grid;
  place-items:center;
  font-size:25px;
  font-weight:900;
  pointer-events:none;
}

.pointer{
  position:absolute;
  z-index:5;
  top:-13px;
  left:50%;
  transform:translateX(-50%);
  width:0;
  height:0;
  border-left:13px solid transparent;
  border-right:13px solid transparent;
  border-top:30px solid #fff;
  filter:drop-shadow(0 3px 8px rgba(0,0,0,.4));
}

.upgrade-result{
  min-height:26px;
  font-weight:800;
  margin-bottom:10px;
}

/* CRASH */

.crash-screen{
  height:360px;
  border-radius:27px;
  border:1px solid var(--border);
  overflow:hidden;
  position:relative;
  background:
    radial-gradient(circle at 50% 100%,rgba(139,92,246,.25),transparent 40%),
    linear-gradient(180deg,#070916,#101327);
  margin-bottom:13px;
}

.stars{
  position:absolute;
  inset:0;
  background-image:
    radial-gradient(circle,rgba(255,255,255,.7) 1px,transparent 1.5px),
    radial-gradient(circle,rgba(255,255,255,.4) 1px,transparent 1.5px);
  background-size:53px 53px,89px 89px;
  animation:stars 12s linear infinite;
}

@keyframes stars{
  to{background-position:0 400px,0 500px}
}

.crash-graph{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

.multiplier{
  position:absolute;
  z-index:3;
  top:22px;
  width:100%;
  text-align:center;
  font-size:42px;
  font-weight:900;
  letter-spacing:-2px;
  text-shadow:0 0 25px rgba(255,255,255,.2);
}

.crash-status{
  position:absolute;
  z-index:3;
  top:72px;
  width:100%;
  text-align:center;
  color:var(--muted);
  font-size:12px;
}

.rocket{
  position:absolute;
  z-index:4;
  left:16%;
  bottom:20%;
  font-size:43px;
  filter:drop-shadow(0 0 15px var(--accent2));
  transform:rotate(-30deg);
  transition:left .1s linear,bottom .1s linear;
}

.flame{
  position:absolute;
  z-index:3;
  left:16%;
  bottom:12%;
  width:35px;
  height:65px;
  border-radius:50%;
  background:linear-gradient(#ffd85c,#ff5b2e,transparent);
  filter:blur(6px);
  transform:rotate(30deg);
  opacity:.85;
}

.crash-countdown{
  position:absolute;
  z-index:5;
  bottom:19px;
  width:100%;
  text-align:center;
  color:var(--muted);
  font-size:12px;
}

.crash-bet{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

/* MODAL */

.modal{
  position:fixed;
  z-index:100;
  inset:0;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding:15px;
  padding-bottom:max(15px,env(safe-area-inset-bottom));
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(8px);
  animation:fade .2s ease;
}

@keyframes fade{
  from{opacity:0}
  to{opacity:1}
}

.modal-box{
  width:min(500px,100%);
  max-height:90dvh;
  overflow:auto;
  border-radius:29px;
  border:1px solid var(--border);
  background:#12141b;
  padding:22px;
  animation:sheet .35s cubic-bezier(.2,.8,.2,1);
  box-shadow:0 30px 90px rgba(0,0,0,.6);
}

@keyframes sheet{
  from{transform:translateY(35px);opacity:0}
  to{transform:none;opacity:1}
}

.modal-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.modal-title h2{
  margin:0;
  font-size:21px;
}

.close{
  width:38px;
  height:38px;
  border-radius:13px;
  background:rgba(255,255,255,.07);
}

.confirm-text{
  color:var(--muted);
  line-height:1.5;
  font-size:13px;
}

.modal-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:15px;
}

.modal-actions button{
  min-height:50px;
  border-radius:15px;
  font-weight:800;
}

.cancel{
  background:rgba(255,255,255,.08);
}

.confirm-danger{
  background:var(--danger);
}

/* CARD PREVIEW */

.virtual-card{
  height:220px;
  border-radius:27px;
  padding:22px;
  background:
    radial-gradient(circle at 90% 0%,rgba(255,255,255,.25),transparent 25%),
    linear-gradient(135deg,var(--accent),#17101f);
  position:relative;
  overflow:hidden;
  margin-bottom:16px;
  box-shadow:0 25px 60px color-mix(in srgb,var(--accent) 25%,transparent);
}

.virtual-card::after{
  content:"";
  position:absolute;
  top:-70%;
  left:-30%;
  width:35%;
  height:240%;
  transform:rotate(25deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);
  animation:shine 5s ease-in-out infinite;
}

@keyframes shine{
  0%,55%{left:-40%}
  80%,100%{left:120%}
}

.vc-logo{
  font-size:18px;
  font-weight:900;
}

.vc-chip{
  width:42px;
  height:32px;
  border-radius:8px;
  background:linear-gradient(135deg,#f0d98c,#fff2b5);
  margin-top:30px;
  position:relative;
}

.vc-number{
  position:absolute;
  left:22px;
  bottom:64px;
  font-size:17px;
  letter-spacing:2px;
}

.vc-owner{
  position:absolute;
  bottom:25px;
  left:22px;
  font-size:10px;
  opacity:.7;
}

.vc-label{
  position:absolute;
  right:22px;
  bottom:25px;
  font-size:9px;
  opacity:.65;
}

/* TOAST */

.toast-container{
  position:fixed;
  z-index:200;
  left:15px;
  right:15px;
  top:max(15px,env(safe-area-inset-top));
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  pointer-events:none;
}

.toast{
  max-width:430px;
  width:max-content;
  padding:12px 16px;
  border-radius:16px;
  background:rgba(25,27,35,.9);
  border:1px solid var(--border);
  backdrop-filter:blur(20px);
  box-shadow:0 15px 40px rgba(0,0,0,.35);
  font-size:12px;
  font-weight:700;
  animation:toastIn .3s ease,toastOut .3s ease 2.7s forwards;
}

@keyframes toastIn{
  from{opacity:0;transform:translateY(-12px) scale(.95)}
  to{opacity:1;transform:none}
}

@keyframes toastOut{
  to{opacity:0;transform:translateY(-10px) scale(.96)}
}

/* COIN */

.earn-center{
  text-align:center;
  padding-top:25px;
}

.coin{
  width:min(245px,65vw);
  aspect-ratio:1;
  border-radius:50%;
  margin:25px auto;
  display:grid;
  place-items:center;
  font-size:75px;
  font-weight:900;
  color:#fff;
  background:
    radial-gradient(circle at 30% 25%,rgba(255,255,255,.45),transparent 18%),
    linear-gradient(145deg,var(--accent2),var(--accent));
  border:7px solid rgba(255,255,255,.18);
  box-shadow:
    0 30px 70px color-mix(in srgb,var(--accent) 35%,transparent),
    inset 0 5px 15px rgba(255,255,255,.2);
  animation:coinIdle 3s ease-in-out infinite;
  user-select:none;
  touch-action:manipulation;
}

@keyframes coinIdle{
  0%,100%{transform:translateY(0) rotate(-2deg)}
  50%{transform:translateY(-8px) rotate(2deg)}
}

.coin.hit{
  animation:coinHit .22s ease;
}

@keyframes coinHit{
  50%{transform:scale(.88) rotate(8deg)}
}

.earn-total{
  font-size:32px;
  font-weight:900;
}

.float-money{
  position:fixed;
  z-index:80;
  pointer-events:none;
  color:var(--success);
  font-weight:900;
  animation:moneyFloat 900ms ease-out forwards;
}

@keyframes moneyFloat{
  from{opacity:1;transform:translate(-50%,-50%) scale(1)}
  to{opacity:0;transform:translate(-50%,-130px) scale(1.25)}
}

/* RESPONSIVE */

@media(max-width:380px){
  .quick-grid{gap:6px}
  .action{min-height:82px}
  .action .icon{width:34px;height:34px}
  .balance-value{font-size:34px}
  .mine-cell{border-radius:11px}
  .nav-item span:last-child{font-size:8px}
}

@media(min-width:700px){
  .casino-grid{
    grid-template-columns:repeat(3,1fr);
  }
  .quick-grid{gap:13px}
  .action{min-height:105px}
}

/* ACCESSIBILITY */

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    scroll-behavior:auto!important;
  }
}
</style>
</head>

<body>
<div id="app"></div>
<div id="toast-container" class="toast-container"></div>

<script>
"use strict";

/* =========================================================
   SVTVN BANK — SINGLE FILE DEMO BANK
   Все данные локальные. Реального банковского API нет.
========================================================= */

const STORAGE_KEY = "svtvn_bank_account_v4";
const SETTINGS_KEY = "svtvn_bank_settings_v4";

let account = null;
let settings = {
  theme:"dark",
  sound:true
};

let currentPage = "home";
let currentGame = null;
let gameTimers = [];
let pinBuffer = "";
let authMode = "login";

const $ = s => document.querySelector(s);

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    account = raw ? JSON.parse(raw) : null;

    const savedSettings = localStorage.getItem(SETTINGS_KEY);
    if(savedSettings){
      settings = {...settings,...JSON.parse(savedSettings)};
    }
  }catch(e){
    account = null;
  }

  applyTheme();
}

function saveAccount(){
  if(!account) return;
  localStorage.setItem(STORAGE_KEY,JSON.stringify(account));
}

function saveSettings(){
  localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));
}

function ensureAccountShape(){
  if(!account) return;

  account.balance = Number(account.balance) || 0;
  account.transactions = Array.isArray(account.transactions) ? account.transactions : [];
  account.clicker = Number(account.clicker) || 0;
  account.stats = account.stats || {
    deposits:0,
    transfers:0,
    games:0,
    wins:0,
    losses:0
  };
}

function applyTheme(){
  const root = document.documentElement;

  const themes = {
    dark:{
      bg:"#08090d",bg2:"#0e1017",accent:"#8b5cf6",accent2:"#c084fc"
    },
    light:{
      bg:"#f2f4f8",bg2:"#ffffff",accent:"#6655e8",accent2:"#9b7cff"
    },
    purple:{
      bg:"#100a18",bg2:"#171021",accent:"#a855f7",accent2:"#e879f9"
    },
    red:{
      bg:"#16090c",bg2:"#1d0d11",accent:"#ef4444",accent2:"#fb7185"
    },
    green:{
      bg:"#07130e",bg2:"#0c1b14",accent:"#16a34a",accent2:"#4ade80"
    },
    blue:{
      bg:"#07101b",bg2:"#0b1725",accent:"#2563eb",accent2:"#60a5fa"
    }
  };

  const t = themes[settings.theme] || themes.dark;

  root.style.setProperty("--bg",t.bg);
  root.style.setProperty("--bg2",t.bg2);
  root.style.setProperty("--accent",t.accent);
  root.style.setProperty("--accent2",t.accent2);

  if(settings.theme==="light"){
    root.style.setProperty("--text","#11131a");
    root.style.setProperty("--muted","#697080");
    root.style.setProperty("--card","rgba(0,0,0,.045)");
    root.style.setProperty("--card2","rgba(0,0,0,.025)");
    root.style.setProperty("--border","rgba(0,0,0,.09)");
    root.style.setProperty("--nav","rgba(247,248,251,.88)");
  }else{
    root.style.setProperty("--text","#fff");
    root.style.setProperty("--muted","#9297a7");
    root.style.setProperty("--card","rgba(255,255,255,.075)");
    root.style.setProperty("--card2","rgba(255,255,255,.045)");
    root.style.setProperty("--border","rgba(255,255,255,.11)");
    root.style.setProperty("--nav","rgba(12,13,19,.82)");
  }
}

function money(value){
  return new Intl.NumberFormat("ru-RU",{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  }).format(Number(value)||0) + " ₽";
}

function compactMoney(value){
  const n = Number(value)||0;
  if(Math.abs(n)>=1000000) return (n/1000000).toFixed(1).replace(".",",")+" млн ₽";
  if(Math.abs(n)>=1000) return (n/1000).toFixed(1).replace(".",",")+" тыс. ₽";
  return money(n);
}

function escapeHTML(str){
  return String(str ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function initials(name){
  return name.trim().split(/\s+/).slice(0,2).map(x=>x[0]||"").join("").toUpperCase() || "S";
}

function formatDate(timestamp){
  return new Intl.DateTimeFormat("ru-RU",{
    day:"2-digit",
    month:"2-digit",
    hour:"2-digit",
    minute:"2-digit"
  }).format(new Date(timestamp));
}

function showToast(message){
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = message;
  $("#toast-container").appendChild(el);

  setTimeout(()=>el.remove(),3100);
}

function tactile(pattern=10){
  try{
    if(navigator.vibrate) navigator.vibrate(pattern);
  }catch(e){}
}

/* =========================================================
   AUDIO
========================================================= */

let audioCtx = null;

function audioReady(){
  if(!settings.sound) return null;
  try{
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(audioCtx.state==="suspended") audioCtx.resume();
    return audioCtx;
  }catch(e){
    return null;
  }
}

function tone(freq,duration=.08,type="sine",volume=.035,delay=0){
  const ctx = audioReady();
  if(!ctx) return;

  const osc = ctx.createOscillator();
  const gain = ctx.createGain();

  osc.type=type;
  osc.frequency.setValueAtTime(freq,ctx.currentTime+delay);
  gain.gain.setValueAtTime(0.0001,ctx.currentTime+delay);
  gain.gain.exponentialRampToValueAtTime(volume,ctx.currentTime+delay+.008);
  gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+delay+duration);

  osc.connect(gain);
  gain.connect(ctx.destination);

  osc.start(ctx.currentTime+delay);
  osc.stop(ctx.currentTime+delay+duration+.02);
}

function soundClick(){
  tone(500,.045,"sine",.025);
}

function soundSuccess(){
  tone(520,.08,"sine",.04);
  tone(780,.12,"sine",.035,.07);
  tone(1040,.16,"sine",.03,.15);
}

function soundError(){
  tone(170,.12,"sawtooth",.025);
  tone(110,.16,"sawtooth",.02,.08);
}

function soundMoney(){
  tone(700,.06,"triangle",.035);
  tone(1050,.09,"triangle",.03,.06);
}

function soundMine(){
  tone(90,.18,"sawtooth",.06);
  tone(55,.25,"square",.035,.08);
}

function soundCrash(){
  tone(120,.3,"sawtooth",.05);
  tone(65,.4,"sawtooth",.04,.12);
}

function soundWin(){
  [660,880,1100,1320].forEach((f,i)=>tone(f,.1,"sine",.035,i*.08));
}

/* =========================================================
   ACCOUNT / TRANSACTIONS
========================================================= */

function addTransaction(type,title,amount,icon="💳"){
  ensureAccountShape();

  const value = Number(amount)||0;

  account.transactions.unshift({
    id:cryptoRandom(),
    type,
    title,
    amount:value,
    icon,
    date:Date.now()
  });

  if(account.transactions.length>150){
    account.transactions.length=150;
  }

  saveAccount();
}

function cryptoRandom(){
  if(window.crypto?.getRandomValues){
    const a=new Uint32Array(2);
    crypto.getRandomValues(a);
    return a[0].toString(16)+a[1].toString(16);
  }
  return Math.random().toString(36).slice(2);
}

function updateBalance(delta){
  ensureAccountShape();
  account.balance = Math.max(0,Number(account.balance)+Number(delta));
  saveAccount();
  refreshGlobalBalance();
}

function refreshGlobalBalance(){
  const els=document.querySelectorAll("[data-balance]");
  els.forEach(el=>el.textContent=money(account?.balance||0));
}

/* =========================================================
   AUTH
========================================================= */

function renderAuth(){
  clearGameTimers();

  $("#app").innerHTML=`
    <div class="auth">
      <div class="auth-orb"></div>
      <div class="auth-orb two"></div>

      <div class="auth-box">
        <div class="logo">svtvn <span>банк</span></div>

        <h1 class="auth-title">${authMode==="register"?"Создать аккаунт":"С возвращением"}</h1>
        <p class="auth-sub">
          ${authMode==="register"
            ?"Создайте локальный демонстрационный аккаунт SVTVN БАНК."
            :"Войдите в свой локальный аккаунт SVTVN БАНК."}
        </p>

        ${authMode==="register" ? `
          <div class="field">
            <label>Имя и фамилия</label>
            <input id="reg-name" autocomplete="name" placeholder="Иван Иванов">
          </div>

          <div class="field">
            <label>Юзернейм</label>
            <input id="reg-username" autocomplete="username" placeholder="ivan">
          </div>

          <div class="field">
            <label>Логин</label>
            <input id="reg-login" autocomplete="username" placeholder="ivan123">
          </div>

          <div class="field">
            <label>Пароль</label>
            <input id="reg-password" type="password" autocomplete="new-password" placeholder="Минимум 6 символов">
          </div>

          <div class="field">
            <label>Код-пароль — 4 цифры</label>
            <input id="reg-pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
          </div>

          <button class="primary" onclick="register()">Создать аккаунт</button>

          <div class="switch-auth">
            Уже есть аккаунт?
            <button onclick="authMode='login';renderAuth()">Войти</button>
          </div>
        ` : `
          <div class="field">
            <label>Логин</label>
            <input id="login" autocomplete="username" placeholder="ivan123">
          </div>

          <div class="field">
            <label>Пароль</label>
            <input id="password" type="password" autocomplete="current-password" placeholder="Ваш пароль">
          </div>

          <button class="primary" onclick="login()">Продолжить</button>

          <div class="switch-auth">
            Нет аккаунта?
            <button onclick="authMode='register';renderAuth()">Зарегистрироваться</button>
          </div>
        `}
      </div>
    </div>
  `;
}

function register(){
  const name=$("#reg-name")?.value.trim();
  const username=$("#reg-username")?.value.trim().replace(/^@/,"");
  const loginValue=$("#reg-login")?.value.trim();
  const password=$("#reg-password")?.value;
  const pin=$("#reg-pin")?.value;

  if(!name || name.split(/\s+/).length<2){
    showToast("Введите имя и фамилию");
    soundError(); tactile([30,20,30]); return;
  }

  if(!/^[a-zA-Zа-яА-Я0-9_]{3,20}$/.test(username)){
    showToast("Юзернейм: 3–20 букв, цифр или _");
    soundError(); return;
  }

  if(loginValue.length<3){
    showToast("Логин слишком короткий");
    soundError(); return;
  }

  if(password.length<6){
    showToast("Пароль должен содержать минимум 6 символов");
    soundError(); return;
  }

  if(!/^\d{4}$/.test(pin)){
    showToast("Код-пароль должен состоять из 4 цифр");
    soundError(); return;
  }

  account={
    name,
    username,
    login:loginValue,
    password,
    pin,
    balance:0,
    card:null,
    transactions:[],
    clicker:0,
    stats:{
      deposits:0,
      transfers:0,
      games:0,
      wins:0,
      losses:0
    },
    createdAt:Date.now()
  };

  saveAccount();
  soundSuccess();
  tactile([20,30,20]);
  showToast("Аккаунт создан");

  setTimeout(()=>{
    showPinScreen();
  },500);
}

function login(){
  if(!account){
    authMode="register";
    renderAuth();
    return;
  }

  const loginValue=$("#login")?.value.trim();
  const password=$("#password")?.value;

  if(loginValue!==account.login || password!==account.password){
    showToast("Неверный логин или пароль");
    soundError();
    tactile([40,25,40]);
    return;
  }

  showPinScreen();
}

function showPinScreen(){
  clearGameTimers();
  pinBuffer="";

  const name=escapeHTML(account?.name||"Пользователь");

function updatePinDots(){
  document.querySelectorAll(".pin-dot").forEach((dot,i)=>{
    dot.classList.toggle("active",i<pinBuffer.length);
  });
}

function pinInput(num){
  if(pinBuffer.length>=4) return;

  pinBuffer+=String(num);
  updatePinDots();
  tone(430+pinBuffer.length*70,.045,"sine",.025);
  tactile(8);

  if(pinBuffer.length===4){
    setTimeout(checkPin,130);
  }
}

function pinDelete(){
  pinBuffer=pinBuffer.slice(0,-1);
  updatePinDots();
  tone(260,.045,"sine",.02);
}

function checkPin(){
  if(pinBuffer===account.pin){
    soundSuccess();
    tactile([20,30,20]);

    const wrap=$("#pin-wrap");
    if(wrap){
      wrap.style.transition=".35s";
      wrap.style.transform="scale(1.04)";
      wrap.style.opacity="0";
    }

    setTimeout(()=>{
      currentPage="home";
      renderApp();
    },350);
  }else{
    soundError();
    tactile([45,25,45]);

    const wrap=$("#pin-wrap");
    if(wrap){
      wrap.animate([
        {transform:"translateX(0)"},
        {transform:"translateX(-12px)"},
        {transform:"translateX(12px)"},
        {transform:"translateX(-8px)"},
        {transform:"translateX(8px)"},
        {transform:"translateX(0)"}
      ],{duration:360});
    }

    pinBuffer="";
    updatePinDots();
    showToast("Неверный код-пароль");
  }
}

function renderHistory(c){
  const income=account.transactions
    .filter(x=>x.type==="income")
    .reduce((s,x)=>s+Math.abs(x.amount),0);

  const expense=account.transactions
    .filter(x=>x.type==="expense")
    .reduce((s,x)=>s+Math.abs(x.amount),0);

  c.innerHTML=`
    <section class="page">
      <div class="section-title" style="margin-top:15px">История</div>

      <div class="stats-grid">
        <div class="stat">
          <small>Доходы</small>
          <strong class="income">${compactMoney(income)}</strong>
        </div>
        <div class="stat">
          <small>Расходы</small>
          <strong class="expense">${compactMoney(expense)}</strong>
        </div>
      </div>

      <div class="chart-wrap">
        <div style="font-size:13px;font-weight:800;margin-bottom:6px">
          Динамика баланса
        </div>
        <canvas id="chart"></canvas>
      </div>

      <div class="section-title">Операции</div>

      <div class="ui-card">
        ${
          account.transactions.length
          ? account.transactions.map(transactionHTML).join("")
          : `<div class="empty">История пока пуста</div>`
        }
      </div>
    </section>
  `;

  requestAnimationFrame(drawChart);
}

function drawChart(){
  const canvas=$("#chart");
  if(!canvas) return;

  const rect=canvas.getBoundingClientRect();
  const dpr=window.devicePixelRatio||1;

  canvas.width=rect.width*dpr;
  canvas.height=rect.height*dpr;

  const ctx=canvas.getContext("2d");
  ctx.scale(dpr,dpr);

  const w=rect.width;
  const h=rect.height;

  ctx.clearRect(0,0,w,h);

  const tx=[...account.transactions].reverse();

  let balance=account.balance;

  const points=[];

  if(!tx.length){
    points.push(balance);
  }else{
    let reconstructed=balance;

    points.push(reconstructed);

    for(let i=tx.length-1;i>=0;i--){
      const t=tx[i];
      reconstructed += t.type==="income" ? -Math.abs(t.amount) : Math.abs(t.amount);
      points.unshift(reconstructed);
    }
  }

  const values=points.length>20?points.slice(-20):points;

  const min=Math.min(...values,0);
  const max=Math.max(...values,1);
  const range=Math.max(max-min,1);

  const padX=8;
  const padY=18;

  const coords=values.map((v,i)=>{
    const x=padX+(i/Math.max(values.length-1,1))*(w-padX*2);
    const y=h-padY-((v-min)/range)*(h-padY*2);
    return {x,y,v};
  });

  ctx.strokeStyle="rgba(255,255,255,.07)";
  ctx.lineWidth=1;

  for(let i=1;i<4;i++){
    const y=(h/4)*i;
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(w,y);
    ctx.stroke();
  }

  if(coords.length>1){
    const grad=ctx.createLinearGradient(0,0,w,0);
    grad.addColorStop(0,getComputedStyle(document.documentElement).getPropertyValue("--accent").trim());
    grad.addColorStop(1,getComputedStyle(document.documentElement).getPropertyValue("--accent2").trim());

    ctx.strokeStyle=grad;
    ctx.lineWidth=3;
    ctx.lineCap="round";
    ctx.lineJoin="round";

    ctx.beginPath();
    coords.forEach((p,i)=>{
      if(i===0)ctx.moveTo(p.x,p.y);
      else ctx.lineTo(p.x,p.y);
    });
    ctx.stroke();

    const last=coords[coords.length-1];

    ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue("--accent2").trim();
    ctx.beginPath();
    ctx.arc(last.x,last.y,5,0,Math.PI*2);
    ctx.fill();
  }

  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue("--muted").trim();
  ctx.font="10px -apple-system,BlinkMacSystemFont,sans-serif";
  ctx.fillText(money(account.balance),8,13);
}

let clickTransactionBuffer=0;
let clickTransactionTimer=null;

function clickCoin(event){
  ensureAccountShape();

  updateBalance(1);
  account.clicker++;

  clickTransactionBuffer++;

  if(!clickTransactionTimer){
    clickTransactionTimer=setTimeout(()=>{
      if(clickTransactionBuffer>0){
        addTransaction(
          "income",
          "Кликер +"+clickTransactionBuffer+" ₽",
          clickTransactionBuffer,
          "₽"
        );
      }

      clickTransactionBuffer=0;
      clickTransactionTimer=null;
    },1000);
  }

  saveAccount();

  soundClick();
  tactile(8);

  const coin=$("#coin");
  if(coin){
    coin.classList.remove("hit");
    void coin.offsetWidth;
    coin.classList.add("hit");
  }

  const x=event?.clientX ?? window.innerWidth/2;
  const y=event?.clientY ?? window.innerHeight/2;

  const moneyEl=document.createElement("div");
  moneyEl.className="float-money";
  moneyEl.textContent="+1 ₽";
  moneyEl.style.left=x+"px";
  moneyEl.style.top=y+"px";
  document.body.appendChild(moneyEl);

  setTimeout(()=>moneyEl.remove(),950);
}

window.selectedMineCount=5;

function startMines(){
  const bet=Number($("#mine-bet").value);
  const mines=window.selectedMineCount||5;

  if(!Number.isFinite(bet)||bet<=0){
    showToast("Введите корректную ставку");
    soundError(); return;
  }

  if(bet>account.balance){
    showToast("Недостаточно средств");
    soundError(); return;
  }

  clearGameTimers();

  const cells=Array.from({length:25},(_,i)=>i);

  for(let i=cells.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [cells[i],cells[j]]=[cells[j],cells[i]];
  }

  const mineSet=new Set(cells.slice(0,mines));

  window._minesGame={
    state:"active",
    bet,
    mines,
    mineSet,
    opened:new Set(),
    currentPotentialWin:0,
    multiplier:1
  };

  updateBalance(-bet);
  account.stats.games++;
  saveAccount();

  soundClick();
  tactile(15);

  renderApp();
}

function renderMinesActive(game){
  return `
    <div class="mines-info">
      <div class="mini-stat">
        <small>Ставка</small>
        <strong>${money(game.bet)}</strong>
      </div>
      <div class="mini-stat">
        <small>Множитель</small>
        <strong id="mine-multiplier">${game.multiplier.toFixed(2)}×</strong>
      </div>
      <div class="mini-stat">
        <small>Забрать</small>
        <strong id="mine-win">${money(game.currentPotentialWin)}</strong>
      </div>
    </div>

      Открыто: ${game.opened.size}
    </div>

    <div class="game-controls">
      <button
        id="cashout-mine"
        class="form-btn"
        ${game.currentPotentialWin<=0?"disabled":""}
        onclick="cashoutMines()"
      >
        ЗАБРАТЬ ${money(game.currentPotentialWin)}
      </button>
    </div>
  `;
}

function createMineGrid(game){
  const grid=$("#mine-grid");
  if(!grid) return;

  grid.innerHTML=Array.from({length:25},(_,i)=>{
    const opened=game.opened.has(i);
    return `
      <button
        class="mine-cell ${opened?(game.mineSet.has(i)?"opened bomb":"opened safe"):""}"
        ${opened?"disabled":""}
        onclick="openMine(${i})"
      >
        ${opened?(game.mineSet.has(i)?"💥":"💎"):""}
      </button>
    `;
  }).join("");
}

function openMine(index){
  const game=window._minesGame;

  if(!game || game.state!=="active" || game.opened.has(index)) return;

  game.opened.add(index);

  if(game.mineSet.has(index)){
    revealAllMines();
    game.state="lost";
    game.currentPotentialWin=0;

    account.stats.losses++;
    saveAccount();

    soundMine();
    tactile([60,35,60,35,80]);

    showToast("Мина! Потенциальный выигрыш сгорел");

    setTimeout(()=>{
      window._minesGame=null;
      renderApp();
    },900);

    renderApp();
    return;
  }

  const safeCount=game.opened.size;
  const arr=MINE_MULTIPLIERS[game.mines] || MINE_MULTIPLIERS[5];

  game.multiplier=arr[Math.min(safeCount-1,arr.length-1)] || (1+safeCount*.15);
  game.currentPotentialWin=game.bet*game.multiplier;

  soundClick();
  tactile(10);

  if(safeCount===25-game.mines){
    game.currentPotentialWin=game.bet*game.multiplier;
    renderApp();
    setTimeout(cashoutMines,400);
    return;
  }

  renderApp();
}

function revealAllMines(){
  const game=window._minesGame;
  if(!game) return;

  game.mineSet.forEach(i=>game.opened.add(i));
  renderApp();
}

function cashoutMines(){
  const game=window._minesGame;

  if(!game || game.state!=="active") return;
  if(game.currentPotentialWin<=0) return;

  const win=game.currentPotentialWin;

  game.state="cashed";
  game.currentPotentialWin=0;

  updateBalance(win);
  account.stats.wins++;
  addTransaction("income","Выигрыш — Мины",win,"💎");
  saveAccount();

  soundWin();
  tactile([20,30,20,30,40]);
  showToast("Вы забрали "+money(win));

  window._minesGame=null;

  setTimeout(()=>renderApp(),600);
}

function generateCrashPoint(){
  // Экспоненциальное распределение:
  // низкие значения встречаются чаще, верхняя граница ограничена.
  const r=Math.random();
  let point=1/(1-r);
  point=Math.max(1.01,Math.min(point,10));

  if(Math.random()<.03) point=1.01+Math.random()*.15;

  return Math.round(point*100)/100;
}

function startCrashRound(){
  clearGameTimers();

  window._crashGame={
    state:"betting",
    remaining:10000,
    multiplier:1,
    crashPoint:generateCrashPoint(),
    bet:null,
    cashed:false,
    startTime:null
  };

  renderApp();
}

function runCrashBetting(){
  const g=window._crashGame;
  if(!g || g.state!=="betting") return;

  const start=performance.now();
  const initial=g.remaining;

  function tick(now){
    if(!window._crashGame || window._crashGame.state!=="betting") return;

    const elapsed=now-start;
    g.remaining=Math.max(0,initial-elapsed);

    const countdown=$("#crash-countdown");
    if(countdown){
      countdown.textContent=
        g.remaining>0
        ? "СТАВКИ ЗАКРОЮТСЯ ЧЕРЕЗ "+Math.ceil(g.remaining/1000)
        : "ЗАПУСК…";
    }

    if(g.remaining<=0){
      beginCrashFlight();
      return;
    }

    requestAnimationFrame(tick);
  }

  requestAnimationFrame(tick);
}

function placeCrashBet(){
  const g=window._crashGame;

  if(!g || g.state!=="betting"){
    showToast("Сначала откройте новый раунд");
    return;
  }

  if(g.bet!==null){
    showToast("Ставка уже сделана");
    return;
  }

  const bet=Number($("#crash-bet-input").value);

  if(!Number.isFinite(bet)||bet<=0){
    showToast("Введите корректную ставку");
    soundError(); return;
  }

  if(bet>account.balance){
    showToast("Недостаточно средств");
    soundError(); return;
  }

  g.bet=bet;

  updateBalance(-bet);
  account.stats.games++;
  saveAccount();

  soundClick();
  tactile(15);
  showToast("Ставка принята");

  renderApp();
}

function beginCrashFlight(){
  const g=window._crashGame;
  if(!g || g.state!=="betting") return;

  g.state="running";
  g.startTime=performance.now();
  g.multiplier=1;

  soundSuccess();
  tactile(20);

  renderApp();
}

function crashMultiplierAt(ms){
  // Плавный рост: быстро в начале и заметно быстрее со временем.
  return Math.max(1,Math.exp(ms/9000));
}

function runCrashAnimation(){
  const g=window._crashGame;
  if(!g || g.state!=="running") return;

  const now=performance.now();
  const elapsed=now-g.startTime;

  g.multiplier=crashMultiplierAt(elapsed);

  if(g.multiplier>=g.crashPoint){
    g.multiplier=g.crashPoint;
    crashEnd();
    return;
  }

  const mult=$("#crash-multiplier");
  const status=$("#crash-status");
  const rocket=$("#rocket");
  const flame=$("#flame");
  const countdown=$("#crash-countdown");

  if(mult) mult.textContent="×"+g.multiplier.toFixed(2);
  if(status) status.textContent="РАКЕТА ЛЕТИТ";
  if(countdown) countdown.textContent="Заберите выигрыш вовремя";

  const progress=Math.min(1,Math.log(g.multiplier)/Math.log(Math.max(g.crashPoint,1.01)));

  if(rocket){
    rocket.style.left=(16+progress*55)+"%";
    rocket.style.bottom=(20+progress*55)+"%";
  }

  if(flame){
    flame.style.left=(16+progress*55)+"%";
    flame.style.bottom=(12+progress*55)+"%";
  }

  drawCrashGraph(progress);

  gameTimers.push(requestAnimationFrame(runCrashAnimation));
}

function drawCrashGraph(progress){
  const canvas=$("#crash-graph");
  if(!canvas) return;

  const rect=canvas.getBoundingClientRect();
  const dpr=window.devicePixelRatio||1;

  if(canvas.width!==rect.width*dpr){
    canvas.width=rect.width*dpr;
    canvas.height=rect.height*dpr;
  }

  const ctx=canvas.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,rect.width,rect.height);

  const w=rect.width;
  const h=rect.height;

  ctx.beginPath();

  const points=32;
  for(let i=0;i<=points;i++){
    const t=i/points;
    const x=30+t*(w-60);
    const curve=Math.pow(t,1.65);
    const y=h-30-curve*(h-110)*Math.max(.2,progress);

    if(i===0)ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  }

  ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue("--accent2").trim();
  ctx.lineWidth=3;
  ctx.lineCap="round";
  ctx.shadowBlur=15;
  ctx.shadowColor=getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
  ctx.stroke();
  ctx.shadowBlur=0;
}

function cashoutCrash(){
  const g=window._crashGame;

  if(!g || g.state!=="running" || g.cashed || g.bet===null) return;

  g.cashed=true;
  g.state="cashed";

  const payout=g.bet*g.multiplier;

  updateBalance(payout);
  account.stats.wins++;
  addTransaction("income","Выигрыш — Crash",payout,"🚀");
  saveAccount();

  soundWin();
  tactile([20,30,20,30,40]);
  showToast("Забрано "+money(payout));

  renderApp();

  setTimeout(()=>{
    if(window._crashGame?.state==="cashed"){
      window._crashGame.state="crashed";
      renderApp();
    }
  },1000);
}

function crashEnd(){
  const g=window._crashGame;
  if(!g || g.state!=="running") return;

  g.state="crashed";

  if(g.bet!==null && !g.cashed){
    account.stats.losses++;
    addTransaction("expense","Ставка — Crash",g.bet,"🚀");
    saveAccount();
  }

  soundCrash();
  tactile([70,30,70,30,100]);

  const rocket=$("#rocket");
  if(rocket){
    rocket.animate([
      {transform:"rotate(-30deg) scale(1)"},
      {transform:"rotate(-30deg) scale(1.4)"},
      {transform:"rotate(-30deg) scale(.2)",opacity:0}
    ],{duration:500});
  }

  showToast("💥 КРАШ ×"+g.crashPoint.toFixed(2));

  setTimeout(renderApp,650);
}

          <div class="setting-main">
            <strong>Статистика</strong>
            <small>Клики: ${account.clicker} · Игр: ${account.stats.games}</small>
          </div>
        </div>

        <div class="setting">
          <div class="setting-icon">💰</div>
          <div class="setting-main">
            <strong>Текущий баланс</strong>
            <small>Единый баланс банка и казино</small>
          </div>
          <strong data-balance>${money(account.balance)}</strong>
        </div>
      </div>

      <button class="danger-btn" onclick="logoutToLogin()">🚪 Выйти</button>
      <button class="danger-btn" onclick="confirmDelete()">🗑️ Удалить аккаунт</button>
    </section>
  `;
}

function toggleSound(){
  settings.sound=!settings.sound;
  saveSettings();

  if(settings.sound){
    soundSuccess();
    tactile(8);
  }

  renderApp();
}

function setTheme(theme){
  settings.theme=theme;
  saveSettings();
  applyTheme();
  soundClick();
  tactile(8);
  renderApp();
}

/* =========================================================
   DELETE ACCOUNT
========================================================= */

function confirmDelete(){
  showModal(`
    <div class="modal-title">
      <h2>Удалить аккаунт?</h2>
      <button class="close" onclick="closeModal()">×</button>
    </div>

    <p class="confirm-text">
      Будут удалены баланс, виртуальная карта, история операций,
      статистика и настройки этого локального аккаунта.
    </p>

    <div class="modal-actions">
      <button class="cancel" onclick="closeModal()">Отмена</button>
      <button class="confirm-danger" onclick="deleteAccount()">Удалить</button>
    </div>
  `);
}

function deleteAccount(){
  clearGameTimers();
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(SETTINGS_KEY);

  account=null;
  settings={
    theme:"dark",
    sound:true
  };

  closeModal();
  authMode="register";
  applyTheme();

  soundError();
  tactile([50,30,50]);

  renderAuth();
}

/* =========================================================
   GAME / TIMER MANAGEMENT
========================================================= */

function clearGameTimers(){
  gameTimers.forEach(t=>{
    try{
      clearTimeout(t);
      clearInterval(t);
      cancelAnimationFrame(t);
    }catch(e){}
  });

  gameTimers=[];

  if(clickTransactionTimer){
    clearTimeout(clickTransactionTimer);
    clickTransactionTimer=null;
    if(clickTransactionBuffer>0 && account){
      addTransaction(
        "income",
        "Кликер +"+clickTransactionBuffer+" ₽",
        clickTransactionBuffer,
        "₽"
      );
      clickTransactionBuffer=0;
    }
  }
}

function leaveGame(){
  clearGameTimers();

  // Если игра активна, не возвращаем потенциальный выигрыш.
  window._minesGame=null;
  window._upgradeGame=null;
  window._crashGame=null;

  currentGame=null;
  navigate("casino");
}

/* =========================================================
   GLOBAL INTERACTION
========================================================= */

document.addEventListener("click",e=>{
  const btn=e.target.closest("button");

  if(btn && !btn.classList.contains("pin-key")){
    // Не накладываем звук поверх специализированных звуков
    if(
      !btn.onclick?.toString().includes("clickCoin") &&
      !btn.closest(".coin")
    ){
      // очень короткий UI click
    }
  }
});

window.addEventListener("resize",()=>{
  if(currentPage==="history"){
    requestAnimationFrame(drawChart);
  }
});

/* =========================================================
   START
========================================================= */

loadData();
ensureAccountShape();

if(account){
  authMode="login";
  renderAuth();
}else{
  authMode="register";
  renderAuth();
}
</script>
</body>
</html>
